---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Image Pull - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: kubernetes/**/*

  extract:
    if: >-
      ${{
        needs.filter.outputs.changed-files != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: filter
    name: Image Pull - Extract Images
    runs-on: ${{ github.event.repository.name }}-runner
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
          install_args: github:home-operations/flate

      - name: Extract Images
        id: extract
        run: |
          echo 'images<<EOF' >> $GITHUB_OUTPUT
          flate diff images -p ./kubernetes/clusters/main -o json >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  pull:
    if: >-
      ${{
        needs.extract.outputs.images != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: extract
    name: Image Pull - Pull Images
    runs-on: ${{ github.event.repository.name }}-runner
    strategy:
      matrix:
        image: ${{ fromJSON(needs.extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
          tool_versions: |
            talosctl latest

      - name: Pull Image
        env:
          IMAGE: ${{ matrix.image }}
        run: talosctl --nodes "$NODE" image pull "$IMAGE"

      # Digest pulls are stored untagged in Zot; requesting the tag makes its on-demand sync record it
      - name: Register Tag in Zot
        env:
          IMAGE: ${{ matrix.image }}
          ZOT_URL: https://registry.bykaj.app
        run: |
          ref="${IMAGE%%@*}"
          name="${ref%:*}"
          tag="${ref##*:}"
          if [[ "$name" == "$ref" || "$tag" == */* ]]; then
            echo "No tag in $IMAGE, skipping"
            exit 0
          fi

          registry="${name%%/*}"
          if [[ "$registry" != *.* && "$registry" != *:* && "$registry" != localhost ]]; then
            registry="docker.io"
            name="docker.io/$name"
          fi
          repo="${name#*/}"

          case "$registry" in
            docker.io)
              prefix="docker-hub"
              [[ "$repo" != */* ]] && repo="library/$repo"
              ;;
            ghcr.io) prefix="ghcr" ;;
            quay.io) prefix="quay" ;;
            registry.k8s.io) prefix="k8s" ;;
            *)
              echo "$registry is not mirrored by Zot, skipping"
              exit 0
              ;;
          esac

          url="$ZOT_URL/v2/$prefix/$repo/manifests/$tag"
          if curl -fsS -o /dev/null --retry 3 \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "$url"; then
            echo "Registered $prefix/$repo:$tag in Zot"
          else
            echo "::warning::Failed to register $prefix/$repo:$tag in Zot"
          fi

  success:
    if: ${{ !cancelled() }}
    needs: pull
    name: Image Pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
