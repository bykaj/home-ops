---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate

on:
  push:
    branches:
      - main
    paths:
      - .renovaterc.json5
      - .renovate/**.json5
  schedule:
    - cron: 20 * * * *
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        type: boolean
        default: false
        required: true
      logLevel:
        description: Log Level
        type: choice
        default: debug
        options:
          - debug
          - info
        required: true
      version:
        description: Renovate Version
        default: latest
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Load Secrets
        id: load-secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1 # zizmor: ignore[unpinned-tools]
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GITHUB_BOT_APP_CLIENT_ID: op://Automation/github-bot/GITHUB_BOT_APP_CLIENT_ID
          GITHUB_BOT_APP_PRIVATE_KEY: op://Automation/github-bot/GITHUB_BOT_APP_PRIVATE_KEY
          DOCKER_HUB_USERNAME: op://Homelab/docker-hub/DOCKER_HUB_USERNAME
          DOCKER_HUB_TOKEN: op://Homelab/docker-hub/DOCKER_HUB_TOKEN

      # Docker Hub's tags API (the only source of release timestamps) doesn't
      # take the access token directly, only a 15-minute JWT exchanged for it
      - name: Get Docker Hub Token
        id: docker-hub
        env:
          DOCKER_HUB_TOKEN: ${{ steps.load-secrets.outputs.DOCKER_HUB_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ steps.load-secrets.outputs.DOCKER_HUB_USERNAME }}
        run: |
          token=$(jq -n --arg u "$DOCKER_HUB_USERNAME" --arg s "$DOCKER_HUB_TOKEN" '{identifier: $u, secret: $s}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' -d @- https://hub.docker.com/v2/auth/token \
            | jq -er .access_token)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_CLIENT_ID }}
          private-key: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'debug' }}
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun }}
          # Docker Hub only pages through the first 1,000 tags anonymously; an
          # image with more tags gets no release timestamps, which holds it
          # forever under a minimumReleaseAge rule. Registry pulls go to
          # docker.io, the tags API (with timestamps) to hub.docker.com
          RENOVATE_HOST_RULES: >-
            [{"hostType": "docker", "matchHost": "docker.io",
            "username": "${{ steps.load-secrets.outputs.DOCKER_HUB_USERNAME }}",
            "password": "${{ steps.load-secrets.outputs.DOCKER_HUB_TOKEN }}"},
            {"hostType": "docker", "matchHost": "hub.docker.com",
            "token": "${{ steps.docker-hub.outputs.token }}"}]
          RENOVATE_INTERNAL_CHECKS_FILTER: strict
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: true
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ inputs.version || 'latest' }}
