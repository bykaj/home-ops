---
apiVersion: v1
kind: Secret
metadata:
  name: onepassword-secret
  namespace: external-secrets
# The 1Password field holds base64-encoded JSON; data decodes it into the raw
# JSON file Connect expects and avoids kustomize unquoting JSON in stringData
data:
  1password-credentials.json: op://Homelab/1password/OP_CREDENTIALS_JSON
stringData:
  token: op://Homelab/1password/OP_CONNECT_TOKEN
