# Zensical configuration for the docs site published to GitHub Pages.
# Build locally with `just docs` (serves on http://localhost:8000).
# Reference: https://zensical.org/docs/setup/basics/

[project]
site_name = "Home Operations"
site_description = "Technical documentation for Kaj's home infrastructure: a bare-metal Talos/Kubernetes cluster and a TrueNAS host, managed with GitOps."
site_author = "Kaj"
site_url = "https://docs.bykaj.com/"
repo_url = "https://github.com/bykaj/home-ops"
repo_name = "bykaj/home-ops"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Kaj Visser. All rights reserved."

nav = [
  { "Home" = "index.md" },
  { "Architecture" = [
    "architecture/index.md",
    { "GitOps" = "architecture/gitops.md" },
    { "Secrets" = "architecture/secrets.md" },
  ] },
  { "Hardware" = [
    "hardware/index.md",
  ] },
  { "Networking" = [
    "networking/index.md",
    { "BGP & Load Balancing" = "networking/bgp.md" },
    { "DNS" = "networking/dns.md" },
    { "UDM Boot Scripts" = "networking/udm-boot-scripts.md" },
  ] },
  { "Storage" = [
    "storage/index.md",
    { "Backups" = "storage/backups.md" },
    { "PostgreSQL" = "storage/postgres.md" },
  ] },
  { "Kubernetes" = [
    "kubernetes/index.md",
    { "Talos" = "kubernetes/talos.md" },
    { "Components" = "kubernetes/components.md" },
    { "Applications" = "kubernetes/applications.md" },
  ] },
  { "Docker" = [
    "docker/index.md",
  ] },
  { "Runbooks" = [
    "runbooks/index.md",
    { "Bootstrap" = "runbooks/bootstrap.md" },
    { "Upgrades" = "runbooks/upgrades.md" },
    { "New Database" = "runbooks/new-database.md" },
    { "Adding an App" = "runbooks/adding-an-app.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Just Recipes" = "reference/just-recipes.md" },
    { "Tooling & Validation" = "reference/tooling.md" },
    { "Cloud Dependencies" = "reference/cloud-dependencies.md" },
    { "Future Plans" = "reference/future-plans.md" },
    { "Glossary" = "reference/glossary.md" },
  ] },
]

[project.theme]
favicon = "assets/logo.png"
language = "en"
logo = "assets/logo.png"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/bykaj/home-ops"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
