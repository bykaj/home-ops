[env]
JUST_UNSTABLE = "1"
FLATE_PATH = "{{config_root}}/kubernetes/clusters/main"
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
LEFTHOOK_OUTPUT = "false"

[settings]
pipx.uvx = true

[tools]
"1password-cli" = "2.39.0"
"actionlint" = "1.7.12"
"cloudflared" = "2026.8.3"
"flux2" = "2.9.5"
"gh" = "2.100.0"
"github:home-operations/flate" = "v0.6.5"
"github:mitsuhiko/minijinja" = "2.24.0"
"github:postfinance/topf" = "v0.6.0"
"gum" = "2.0.0"
"helm" = "4.2.4"
"helmfile" = "1.7.4"
"jq" = "1.8.2"
"just" = "1.58.0"
"krew" = "0.5.0"
"kubeconform" = "0.8.0"
"kubectl" = "1.37.0"
"kustomize" = "5.8.1"
"lefthook" = "2.1.12"
"node" = "26.8.2"
"oxfmt" = "0.67.0"
"pipx:ansible" = "14.4.0"
"pipx:ansible-core" = "2.21.4"
"sd" = "1.1.0"
"shellcheck" = "0.11.0"
"talos" = "1.14.0"
"uv" = "0.12.13"
"yq" = "4.53.6"
"zizmor" = "1.30.1"

[hooks]
postinstall = [
  "lefthook install",
  "ansible-galaxy install -r {{config_root}}/ansible/requirements.yaml",
]

