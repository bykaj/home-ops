[env]
JUST_UNSTABLE = "1"
FLATE_PATH = "{{config_root}}/kubernetes/apps"
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
LEFTHOOK_OUTPUT = "false"

[settings]
pipx.uvx = true

[tools]
"actionlint" = "1.7.12"
"aqua:1password/cli" = "2.42.0"
"cloudflared" = "2026.11.0"
"crane" = "0.22.1"
"flux2" = "2.10.0"
"gh" = "2.104.0"
"github:docker/compose" = "v5.7.1"
"github:home-operations/flate" = "v0.7.3"
"github:mitsuhiko/minijinja" = "3.1.0"
"github:postfinance/topf" = "v0.6.2"
"gum" = "2.0.2"
"helm" = "4.3.2"
"aqua:helmfile/helmfile" = "1.8.4"
"jq" = "1.8.2"
"just" = "1.59.0"
"krew" = "0.5.0"
"kubeconform" = "0.8.0"
"kubectl" = "1.37.2"
"kustomize" = "5.8.3"
"lefthook" = "2.2.2"
"node" = "26.13.0"
"oxfmt" = "0.75.0"
"pipx:ansible" = "14.6.0"
"pipx:ansible-core" = "2.22.0"
"pipx:yamllint" = "1.38.0"
"pipx:zensical" = "0.1.1"
"ripgrep" = "15.2.0"
"sd" = "1.1.0"
"shellcheck" = "0.11.0"
"talos" = "1.14.5"
"uv" = "0.13.8"
"yq" = "4.54.3"
"zizmor" = "1.32.0"

[hooks]
postinstall = [
  "lefthook install",
  "ansible-galaxy install -r {{config_root}}/ansible/requirements.yaml",
]

