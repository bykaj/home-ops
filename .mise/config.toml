[env]
JUST_UNSTABLE = "1"
FLATE_PATH = "{{config_root}}/kubernetes/flux/cluster"
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talosconfig"
LEFTHOOK_OUTPUT = "false"

[settings]
pipx.uvx = true

[tools]
1password-cli = "2.39.0"
"actionlint" = "1.7.12"
"github:home-operations/flate" = "v0.6.5"
"github:mitsuhiko/minijinja" = "2.24.0"
"jq" = "1.8.2"
"just" = "1.58.0"
"lefthook" = "2.1.12"
"node" = "26.8.1"
"oxfmt" = "0.66.0"
"pipx:ansible" = "14.3.1"
"pipx:ansible-core" = "2.21.3"
"shellcheck" = "0.11.0"
"talos" = "1.14.0"
"uv" = "0.12.9"
"yq" = "4.53.6"
"zizmor" = "1.30.0"

[hooks]
postinstall = [
  "lefthook install",
  # "brew bundle --file {{config_root}}/bootstrap/workstation/Brewfile",
  # "ansible-galaxy install -r {{config_root}}/ansible/requirements.yaml",
]

