---
name: dexd
services:
  dexd:
    container_name: dexd
    environment:
      DEFAULT_TARGET: proxy.bykaj.app
      TXT_PREFIX: dkr.
      UNIFI_API_KEY: ${UNIFI_API_KEY}
      UNIFI_HOST: https://gateway.home.cetana.net
    image: ghcr.io/ishioni/dexd:0.4.4
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
