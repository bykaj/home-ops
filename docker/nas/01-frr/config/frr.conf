frr version 10.7
frr defaults traditional
hostname nas-frr
log stdout
no ipv6 forwarding
!
router bgp 64515
 bgp router-id 10.73.1.10
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.73.0.254 remote-as 64513
 !
 address-family ipv4 unicast
  network 10.73.2.100/32
 exit-address-family
exit
!
line vty
!
