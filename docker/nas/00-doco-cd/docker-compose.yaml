---
# doco-cd deploys this stack itself (SELF_UPDATE_ENABLED). Ansible only starts it on a fresh NAS
# (`just bootstrap nas`), reusing this file. The project name must match the directory name, since
# that's what doco-cd uses to recognise its own container.
name: 00-doco-cd
networks:
  apps:
    name: apps
    external: true
secrets:
  1pw_token:
    file: /home/truenas_admin/.config/doco-cd/1pw_token
  api_secret:
    file: /home/truenas_admin/.config/doco-cd/api_secret
  webhook_secret:
    file: /home/truenas_admin/.config/doco-cd/webhook_secret
services:
  app:
    container_name: doco-cd
    environment:
      API_SECRET_FILE: /run/secrets/api_secret
      DEPLOY_CONFIG_BASE_DIR: ./docker/nas/
      HTTP_PORT: 8880
      LOG_LEVEL: info
      POLL_CONFIG: |-
        - url: https://github.com/bykaj/home-ops.git
          reference: refs/heads/main
          interval: 3600
      SECRET_PROVIDER: 1password
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /run/secrets/1pw_token
      SELF_UPDATE_ENABLED: "true"
      TZ: Europe/Amsterdam
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
    healthcheck:
      test:
        - CMD
        - /doco-cd
        - healthcheck
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    image: ghcr.io/kimdre/doco-cd:0.124.0@sha256:31d3755a206ba5c7bc2d12752a9170edf327b2f36f815a8bc992753434f04676
    labels:
      dexd.enabled: "true"
      traefik.enable: "true"
      traefik.http.routers.doco-cd.rule: Host(`doco-cd.bykaj.app`)
      traefik.http.services.doco-cd.loadbalancer.server.port: "8880"
    networks:
      - apps
    restart: unless-stopped
    secrets:
      - 1pw_token
      - api_secret
      - webhook_secret
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
volumes:
  # Created by Ansible; external so the volume (repo cache and self-update journal) keeps its name
  # whatever the project is called
  data:
    external: true
    name: doco-cd_data
