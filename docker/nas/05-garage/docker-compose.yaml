---
name: garage
networks:
  apps:
    name: apps
    external: true
services:
  garage:
    command:
      - /garage
      - "-c"
      - /etc/garage/garage.toml
      - server
    container_name: garage
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
    image: docker.io/dxflrs/garage:v2.4.1
    labels:
      dexd.enabled: "true"
      traefik.enable: "true"
      traefik.http.routers.garage-s3.rule: Host(`s3.bykaj.io`)
      traefik.http.services.garage-s3.loadbalancer.server.port: "9000"
    networks:
      - apps
    restart: unless-stopped
    user: "4000:4000"
    volumes:
      - ./config/garage.toml:/etc/garage/garage.toml:ro
      - meta:/var/lib/garage/meta
      - data:/var/lib/garage/data
  garage-ui:
    container_name: garage-ui
    environment:
      GARAGE_UI_AUTH_OIDC_ADMIN_ROLE: "Administrators"
      GARAGE_UI_AUTH_OIDC_CLIENT_ID: ${GARAGE_UI_OIDC_CLIENT_ID}
      GARAGE_UI_AUTH_OIDC_CLIENT_SECRET: ${GARAGE_UI_OIDC_CLIENT_SECRET}
      GARAGE_UI_AUTH_OIDC_COOKIE_SECURE: "true"
      GARAGE_UI_AUTH_OIDC_ENABLED: "true"
      GARAGE_UI_AUTH_OIDC_ISSUER_URL: "https://auth.cetana.id/application/o/garage/"
      GARAGE_UI_AUTH_OIDC_PROVIDER_NAME: "Cetana ID"
      GARAGE_UI_AUTH_OIDC_ROLE_ATTRIBUTE_PATH: "groups"
      GARAGE_UI_AUTH_OIDC_SCOPES: "openid email profile groups"
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: "http://garage:9002"
      GARAGE_UI_GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_UI_GARAGE_ENDPOINT: "http://garage:9000"
      GARAGE_UI_GARAGE_REGION: "eu-west"
      GARAGE_UI_SERVER_DOMAIN: "garage.bykaj.app"
      GARAGE_UI_SERVER_ENVIRONMENT: "production"
      GARAGE_UI_SERVER_HOST: "0.0.0.0"
      GARAGE_UI_SERVER_PORT: "8080"
      GARAGE_UI_SERVER_ROOT_URL: "https://garage.bykaj.app"
    image: docker.io/noooste/garage-ui:v0.12.1
    labels:
      dexd.enabled: "true"
      traefik.enable: "true"
      traefik.http.routers.garage-ui.rule: Host(`garage.bykaj.app`)
      traefik.http.services.garage-ui.loadbalancer.server.port: "8080"
    networks:
      - apps
    restart: unless-stopped
volumes:
  data:
    driver: local
    driver_opts:
      device: /mnt/vault/Applications/garage/data
      o: bind
      type: none
  meta:
    driver: local
    driver_opts:
      device: /mnt/vault/Applications/garage/meta
      o: bind
      type: none
