# Zensical configuration for the docs site published to GitHub Pages.
# Preview locally with `just docs serve` (serves on http://localhost:8000).
# Reference: https://zensical.org/docs/setup/basics/

[project]
site_name = "Home Operations"
site_description = "Technical documentation for Kaj's home infrastructure: a bare-metal Talos/Kubernetes cluster and a TrueNAS host, managed with GitOps."
site_author = "Kaj"
site_url = "https://docs.bykaj.com/"
repo_url = "https://github.com/bykaj/home-ops"
repo_name = "bykaj/home-ops"
docs_dir = "content"
edit_uri = "edit/main/docs/content/"
copyright = "Copyright &copy; 2026 Kaj Visser. All rights reserved."

nav = [
  { "Home" = "index.md" },
  { "Infrastructure" = [
    { "Architecture" = [
      "infrastructure/architecture/index.md",
      { "GitOps" = "infrastructure/architecture/gitops.md" },
      { "Secrets" = "infrastructure/architecture/secrets.md" },
    ] },
    { "Hardware" = "infrastructure/hardware/index.md" },
    { "Networking" = [
      "infrastructure/networking/index.md",
      { "BGP & Load Balancing" = "infrastructure/networking/bgp.md" },
      { "DNS" = "infrastructure/networking/dns.md" },
      { "UDM Boot Scripts" = "infrastructure/networking/udm-boot-scripts.md" },
    ] },
    { "Storage" = [
      "infrastructure/storage/index.md",
      { "Backups" = "infrastructure/storage/backups.md" },
      { "PostgreSQL" = "infrastructure/storage/postgres.md" },
    ] },
  ] },
  { "Platforms" = [
    { "Kubernetes" = [
      "platforms/kubernetes/index.md",
      { "Talos" = "platforms/kubernetes/talos.md" },
      { "Components" = "platforms/kubernetes/components.md" },
      { "Applications" = "platforms/kubernetes/applications.md" },
      { "App Notes" = "platforms/kubernetes/app-notes.md" },
    ] },
    { "Docker" = "platforms/docker/index.md" },
  ] },
  { "Operations" = [
    { "Runbooks" = [
      "operations/runbooks/index.md",
      { "Bootstrap" = "operations/runbooks/bootstrap.md" },
      { "Upgrades" = "operations/runbooks/upgrades.md" },
      { "Health Check" = "operations/runbooks/health-check.md" },
      { "New Database" = "operations/runbooks/new-database.md" },
      { "Adding an App" = "operations/runbooks/adding-an-app.md" },
      { "Retiring an App" = "operations/runbooks/retiring-an-app.md" },
      { "Adding a Domain" = "operations/runbooks/adding-a-domain.md" },
    ] },
    { "Alerting" = "operations/alerting.md" },
    { "Troubleshooting" = [
      "operations/troubleshooting/index.md",
      { "Known Noise" = "operations/troubleshooting/known-noise.md" },
      { "Knowledge Base" = [
        "operations/troubleshooting/kb/001-flux-empty-object-null.md",
        "operations/troubleshooting/kb/002-helmrelease-missing-rollback-target.md",
        "operations/troubleshooting/kb/003-flux-instance-no-prune.md",
        "operations/troubleshooting/kb/004-resumed-helmrelease-stays-scaled-down.md",
        "operations/troubleshooting/kb/005-bootstrap-helm-field-manager-leftovers.md",
        "operations/troubleshooting/kb/006-tofqdns-timeouts.md",
        "operations/troubleshooting/kb/007-nfs-eperm-after-reboot.md",
        "operations/troubleshooting/kb/008-kopiur-mover-uid-change.md",
        "operations/troubleshooting/kb/009-certificate-retry-backoff.md",
        "operations/troubleshooting/kb/010-onepassword-connect-credentials.md",
        "operations/troubleshooting/kb/011-zot-ignores-config-changes.md",
        "operations/troubleshooting/kb/012-nut-exporter-access-denied.md",
        "operations/troubleshooting/kb/013-unifi-fixed-ip-nic-swap.md",
        "operations/troubleshooting/kb/014-renovate-mise-safe-mode.md",
        "operations/troubleshooting/kb/015-renovate-release-age-holds-forever.md",
        "operations/troubleshooting/kb/016-oxfmt-dash-comment-trailing-space.md",
        "operations/troubleshooting/kb/017-gatus-external-route-internal-host.md",
      ] },
    ] },
    { "History" = [
      "operations/history/index.md",
      { "Incidents" = [
        { "2026-09 Ceph NVMe Failure" = "operations/history/2026-09-ceph-nvme-failure.md" },
        { "2026-10 etcd Fragmentation" = "operations/history/2026-10-etcd-fragmentation.md" },
        { "2026-10 LiteLLM Compromise" = "operations/history/2026-10-litellm-compromise.md" },
      ] },
      { "Migrations" = [
        { "2026-10 Cilium 1.20" = "operations/history/2026-10-cilium-1-20.md" },
        { "2026-10 Pocket ID" = "operations/history/2026-10-pocket-id.md" },
      ] },
    ] },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Just Recipes" = "reference/just-recipes.md" },
    { "Tooling & Validation" = "reference/tooling.md" },
    { "Cloud Dependencies" = "reference/cloud-dependencies.md" },
    { "Future Plans" = "reference/future-plans.md" },
    { "Glossary" = "reference/glossary.md" },
  ] },
]

[project.theme]
favicon = "assets/logo.png"
language = "en"
logo = "assets/logo.png"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/bykaj/home-ops"

[[project.extra.social]]
icon = "fontawesome/brands/mastodon"
link = "https://mastodon.social/@bykaj"

[[project.extra.social]]
icon = "fontawesome/brands/bluesky"
link = "https://bsky.app/profile/bykaj.com"

# Download external assets (Google Fonts, theme scripts) at build time and
# serve them from the site, so readers' browsers never hit third-party CDNs.
# Options match the Material for MkDocs plugin (Zensical has no page for it yet):
# https://squidfunk.github.io/mkdocs-material/plugins/privacy/
[project.plugins.privacy]
# The theme's video player references Google's ad SDK, which pulls in
# googlesyndication.com; the site has no video ads, so don't self-host it.
assets_exclude = ["imasdk.googleapis.com/*"]

# Old URLs from before the pages were grouped into Infrastructure, Platforms
# and Operations (2026-10).
[project.plugins.redirects.redirect_maps]
"architecture/gitops.md" = "infrastructure/architecture/gitops.md"
"architecture/index.md" = "infrastructure/architecture/index.md"
"architecture/secrets.md" = "infrastructure/architecture/secrets.md"
"docker/index.md" = "platforms/docker/index.md"
"hardware/index.md" = "infrastructure/hardware/index.md"
"kubernetes/alerting.md" = "operations/alerting.md"
"kubernetes/applications.md" = "platforms/kubernetes/applications.md"
"kubernetes/components.md" = "platforms/kubernetes/components.md"
"kubernetes/index.md" = "platforms/kubernetes/index.md"
"kubernetes/talos.md" = "platforms/kubernetes/talos.md"
"networking/bgp.md" = "infrastructure/networking/bgp.md"
"networking/dns.md" = "infrastructure/networking/dns.md"
"networking/index.md" = "infrastructure/networking/index.md"
"networking/udm-boot-scripts.md" = "infrastructure/networking/udm-boot-scripts.md"
"runbooks/adding-a-domain.md" = "operations/runbooks/adding-a-domain.md"
"runbooks/adding-an-app.md" = "operations/runbooks/adding-an-app.md"
"runbooks/bootstrap.md" = "operations/runbooks/bootstrap.md"
"runbooks/index.md" = "operations/runbooks/index.md"
"runbooks/new-database.md" = "operations/runbooks/new-database.md"
"runbooks/upgrades.md" = "operations/runbooks/upgrades.md"
"storage/backups.md" = "infrastructure/storage/backups.md"
"storage/index.md" = "infrastructure/storage/index.md"
"storage/postgres.md" = "infrastructure/storage/postgres.md"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
