# Zensical configuration for the docs site published to GitHub Pages.
# Preview locally with `just docs serve` (serves on http://localhost:8000).
# Reference: https://zensical.org/docs/setup/basics/

[project]
site_name = "Home Operations"
site_description = "Technical documentation for Kaj's home infrastructure: a bare-metal Talos/Kubernetes cluster and a TrueNAS host, managed with GitOps."
site_author = "Kaj"
site_url = "https://docs.bykaj.com/"
repo_url = "https://github.com/bykaj/home-ops"
repo_name = "bykaj/home-ops"
docs_dir = "content"
edit_uri = "edit/main/docs/content/"
copyright = "Copyright &copy; 2026 Kaj Visser. All rights reserved."

nav = [
  { "Home" = "index.md" },
  { "Architecture" = [
    "architecture/index.md",
    { "GitOps" = "architecture/gitops.md" },
    { "Secrets" = "architecture/secrets.md" },
  ] },
  { "Hardware" = [
    "hardware/index.md",
  ] },
  { "Networking" = [
    "networking/index.md",
    { "BGP & Load Balancing" = "networking/bgp.md" },
    { "DNS" = "networking/dns.md" },
    { "UDM Boot Scripts" = "networking/udm-boot-scripts.md" },
  ] },
  { "Storage" = [
    "storage/index.md",
    { "Backups" = "storage/backups.md" },
    { "PostgreSQL" = "storage/postgres.md" },
  ] },
  { "Kubernetes" = [
    "kubernetes/index.md",
    { "Talos" = "kubernetes/talos.md" },
    { "Components" = "kubernetes/components.md" },
    { "Applications" = "kubernetes/applications.md" },
    { "Alerting" = "kubernetes/alerting.md" },
  ] },
  { "Docker" = [
    "docker/index.md",
  ] },
  { "Runbooks" = [
    "runbooks/index.md",
    { "Bootstrap" = "runbooks/bootstrap.md" },
    { "Upgrades" = "runbooks/upgrades.md" },
    { "Health Check" = "runbooks/health-check.md" },
    { "New Database" = "runbooks/new-database.md" },
    { "Adding an App" = "runbooks/adding-an-app.md" },
    { "Adding a Domain" = "runbooks/adding-a-domain.md" },
  ] },
  { "Troubleshooting" = [
    "troubleshooting/index.md",
    { "Known Noise" = "troubleshooting/known-noise.md" },
    { "Knowledge Base" = [
      { "001 · Flux applies {} as null" = "troubleshooting/kb/001-flux-empty-object-null.md" },
      { "002 · MissingRollbackTarget" = "troubleshooting/kb/002-helmrelease-missing-rollback-target.md" },
      { "003 · flux-instance leftovers" = "troubleshooting/kb/003-flux-instance-no-prune.md" },
      { "004 · Resumed HR at zero" = "troubleshooting/kb/004-resumed-helmrelease-stays-scaled-down.md" },
      { "005 · Bootstrap field leftovers" = "troubleshooting/kb/005-bootstrap-helm-field-manager-leftovers.md" },
      { "006 · toFQDNs timeouts" = "troubleshooting/kb/006-tofqdns-timeouts.md" },
      { "007 · NFS EPERM after reboot" = "troubleshooting/kb/007-nfs-eperm-after-reboot.md" },
      { "008 · Kopiur mover UID change" = "troubleshooting/kb/008-kopiur-mover-uid-change.md" },
      { "009 · Certificate retry backoff" = "troubleshooting/kb/009-certificate-retry-backoff.md" },
      { "010 · 1Password Connect credentials" = "troubleshooting/kb/010-onepassword-connect-credentials.md" },
      { "011 · Zot config changes" = "troubleshooting/kb/011-zot-ignores-config-changes.md" },
      { "012 · nut-exporter access denied" = "troubleshooting/kb/012-nut-exporter-access-denied.md" },
      { "013 · UniFi fixed IP NIC swap" = "troubleshooting/kb/013-unifi-fixed-ip-nic-swap.md" },
      { "014 · Renovate mise safe mode" = "troubleshooting/kb/014-renovate-mise-safe-mode.md" },
      { "015 · Renovate release age" = "troubleshooting/kb/015-renovate-release-age-holds-forever.md" },
      { "016 · oxfmt trailing space" = "troubleshooting/kb/016-oxfmt-dash-comment-trailing-space.md" },
      { "017 · Gatus no such host" = "troubleshooting/kb/017-gatus-external-route-internal-host.md" },
    ] },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Just Recipes" = "reference/just-recipes.md" },
    { "Tooling & Validation" = "reference/tooling.md" },
    { "Cloud Dependencies" = "reference/cloud-dependencies.md" },
    { "Future Plans" = "reference/future-plans.md" },
    { "Glossary" = "reference/glossary.md" },
  ] },
]

[project.theme]
favicon = "assets/logo.png"
language = "en"
logo = "assets/logo.png"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/bykaj/home-ops"

[[project.extra.social]]
icon = "fontawesome/brands/mastodon"
link = "https://mastodon.social/@bykaj"

[[project.extra.social]]
icon = "fontawesome/brands/bluesky"
link = "https://bsky.app/profile/bykaj.com"

# Download external assets (Google Fonts, theme scripts) at build time and
# serve them from the site, so readers' browsers never hit third-party CDNs.
# Options match the Material for MkDocs plugin (Zensical has no page for it yet):
# https://squidfunk.github.io/mkdocs-material/plugins/privacy/
[project.plugins.privacy]
# The theme's video player references Google's ad SDK, which pulls in
# googlesyndication.com; the site has no video ads, so don't self-host it.
assets_exclude = ["imasdk.googleapis.com/*"]

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
