---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Confidential Pocket ID client (with PKCE), shared by the dashboard and
        # the web app; the env vars win over dashboard.oauth.self_hosted
        HERMES_DASHBOARD_OIDC_CLIENT_ID: "{{ .HM_OIDC_CLIENT_ID }}"
        HERMES_DASHBOARD_OIDC_CLIENT_SECRET: "{{ .HM_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: hermes
      rewrite: [{ regexp: { source: (.*), target: HM_$1 } }]
---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
# Signal settings for the ops profile, read only by the setup init container,
# which writes them into that profile's .env. Not in hermes-secret: that one
# is the pod's environment, where the default profile would pick Signal up too
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-signal
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-signal
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Hermes' own number, registered in signal-cli (E.164, +31...)
        SIGNAL_ACCOUNT: "{{ .HM_SIGNAL_ACCOUNT_NUMBER }}"
        # The only sender allowed to message Hermes, under both identifiers:
        # Hermes checks one per message, the number when Signal includes it
        # (once the owner shares it) and the account UUID (ACI) otherwise
        SIGNAL_ALLOWED_USERS: "{{ .HM_SIGNAL_OWNER_NUMBER }},{{ .HM_SIGNAL_OWNER_UUID }}"
        # Cron reports go to the UUID, which works whatever the owner's
        # number privacy settings are
        SIGNAL_HOME_CHANNEL: "{{ .HM_SIGNAL_OWNER_UUID }}"
  dataFrom:
    - extract:
        key: hermes
      rewrite: [{ regexp: { source: (.*), target: HM_$1 } }]
