---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Confidential Pocket ID client (with PKCE), shared by the dashboard and
        # the web app; the env vars win over dashboard.oauth.self_hosted
        HERMES_DASHBOARD_OIDC_CLIENT_ID: "{{ .HM_OIDC_CLIENT_ID }}"
        HERMES_DASHBOARD_OIDC_CLIENT_SECRET: "{{ .HM_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: hermes
      rewrite: [{ regexp: { source: (.*), target: HM_$1 } }]
