---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 60
        strategy: Recreate
        initContainers:
          # 1. The image's config migration, which its own boot hook runs
          #    through `s6-setuidgid hermes`; that needs CAP_SETGID and fails
          #    as non-root. Skipped on first boot, when no config exists yet.
          # 2. Points the default profile at LiteLLM. Hermes seeds a new profile
          #    with Opus through OpenRouter, and providers and MCP servers have
          #    to live in the profile itself, not in the managed overlay. The
          #    provider and the MCP server are set on every start (Git wins);
          #    the model only while the profile doesn't use LiteLLM yet, so a
          #    model picked in the dashboard survives restarts. $${...} keeps
          #    Flux from substituting
          setup:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                if [ -f /opt/data/config.yaml ]; then
                  /opt/hermes/.venv/bin/python /opt/hermes/scripts/docker_config_migrate.py
                fi
                set_key() {
                  hermes config set "$1" "$2" >/dev/null 2>&1 || { echo "failed to set $1"; exit 1; }
                  echo "set $1"
                }
                set_key providers.litellm.name LiteLLM
                set_key providers.litellm.api http://litellm.ai.svc.cluster.local:4000/v1
                set_key providers.litellm.key_env LITELLM_API_KEY
                set_key providers.litellm.discover_models true
                set_key mcp_servers.litellm.url http://litellm.ai.svc.cluster.local:4000/mcp/
                set_key mcp_servers.litellm.headers '{"x-litellm-api-key": "Bearer $${LITELLM_API_KEY}"}'
                current=$(hermes config get model.provider 2>/dev/null | tail -n 1)
                if [ "$current" != "custom:litellm" ]; then
                  set_key model.provider custom:litellm
                  set_key model.default chatgpt/gpt-6.1-sol
                  set_key model.base_url http://litellm.ai.svc.cluster.local:4000/v1
                  # maxInputTokens of the LiteLLM model; Hermes can't read it
                  set_key model.context_length 272000
                fi
            env:
              HERMES_HOME: /opt/data
              HOME: /opt/data
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: *image
            # The gateway serves the web app; HERMES_DASHBOARD adds the
            # dashboard as a second s6 service
            args:
              - gateway
              - run
            env:
              # boto3 (model listing) probes the EC2 metadata address
              # 169.254.169.254, which hermes-egress blocks
              AWS_EC2_METADATA_DISABLED: "true"
              HERMES_DASHBOARD: "true"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: "9119"
              # Tools come with the image; installing more needs the internet
              HERMES_DISABLE_LAZY_INSTALLS: "true"
              HERMES_HOME: /opt/data
              HERMES_WRITE_SAFE_ROOT: /opt/data
              HOME: /opt/data
              # Read by the profile (provider key_env, MCP headers); not passed
              # to the terminal, which only gets terminal.env_passthrough
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-litellm
                    key: api-key
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
            # Pocket ID client ID and secret
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              # The gateway's cron ticker writes a heartbeat every 60 s
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /bin/sh
                      - -c
                      - >-
                        hb=$(cut -d. -f1 /opt/data/cron/ticker_heartbeat) &&
                        [ $(( $(date +%s) - hb )) -lt 300 ]
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
            setup:
              - path: /opt/data
      config:
        type: configMap
        name: hermes-configmap
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes
                readOnly: true
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      dashboard:
        hostnames:
          - hermes.bykaj.app
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 9119
      webapp:
        hostnames:
          - chat.bykaj.app
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 9120
            # Streamed replies and websockets stay open
            timeouts:
              request: 0s
    service:
      app:
        ports:
          dashboard:
            appProtocol: kubernetes.io/wss
            port: 9119
          webapp:
            appProtocol: kubernetes.io/wss
            port: 9120
