---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 60
        strategy: Recreate
        initContainers:
          # Config migration and LiteLLM settings for every profile; what it
          # does and why is in resources/setup.sh
          setup:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v0.23.2@sha256:d6746a084e9341baada483e3d6210444d3c1aeb7c130f0915150065fb2851459
            command:
              - /bin/sh
              - /scripts/setup.sh
            env:
              HERMES_HOME: /opt/data
              # Named profiles, space-separated; deleting one stays manual
              # (hermes profile delete)
              HERMES_PROFILES: ops
              # The one profile that owns the Signal number; its cron jobs
              # can then deliver to Signal
              HERMES_SIGNAL_PROFILE: ops
              HOME: /opt/data
            # SIGNAL_* for that profile; optional, so setup still runs while
            # the 1Password fields don't exist yet (Signal then stays off)
            envFrom:
              - secretRef:
                  name: hermes-signal
                  optional: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: *image
            # The gateway serves the web app; HERMES_DASHBOARD adds the
            # dashboard as a second s6 service
            args:
              - gateway
              - run
            env:
              # boto3 (model listing) probes the EC2 metadata address
              # 169.254.169.254, which hermes-egress blocks
              AWS_EC2_METADATA_DISABLED: "true"
              HERMES_DASHBOARD: "true"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: "9119"
              # Tools come with the image; installing more needs the internet
              HERMES_DISABLE_LAZY_INSTALLS: "true"
              HERMES_HOME: /opt/data
              HERMES_WRITE_SAFE_ROOT: /opt/data
              HOME: /opt/data
              # Read by the profile (provider key_env, MCP headers); not passed
              # to the terminal, which only gets terminal.env_passthrough
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-litellm
                    key: api-key
              # mise (the image volume below) keeps its tools and its global
              # config on the PVC. The terminal's HOME moves into each profile,
              # so the paths are fixed to share one install between profiles
              MISE_CACHE_DIR: /opt/data/.cache/mise
              MISE_CONFIG_DIR: /opt/data/.config/mise
              MISE_DATA_DIR: /opt/data/.local/share/mise
              # Skips mise's self-update check (mise.jdx.dev, blocked by
              # hermes-egress), which stalled `mise --version` for 90 s; the
              # binary comes from the image, which Renovate updates
              MISE_DISABLE_UPDATE_WARNING: "1"
              MISE_STATE_DIR: /opt/data/.local/state/mise
              # The image's PATH with mise's shims and binary after Hermes' own
              PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/opt/data/.local/share/mise/shims:/opt/mise:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
            # Pocket ID client ID and secret
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              # The gateway's cron ticker writes a heartbeat every 60 s
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /bin/sh
                      - -c
                      - >-
                        hb=$(cut -d. -f1 /opt/data/cron/ticker_heartbeat) &&
                        [ $(( $(date +%s) - hb )) -lt 300 ]
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
            setup:
              - path: /opt/data
      config:
        type: configMap
        name: hermes-configmap
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes
                readOnly: true
      # The mise binary from its image, for installing CLI tools on the PVC;
      # downloads are limited to GitHub by hermes-egress
      mise:
        type: image
        image:
          repository: ghcr.io/jdx/mise
          tag: 2026.11.11@sha256:14a30b9945ea5c2fbae70d8b6be8f2c8b2456698f2a258f3f6315f7784c84676
        advancedMounts:
          hermes:
            app:
              - path: /opt/mise
                readOnly: true
                subPath: usr/local/bin
      scripts:
        type: configMap
        name: hermes-scripts
        advancedMounts:
          hermes:
            setup:
              - path: /scripts
                readOnly: true
      # The hermes key as a file, for the named profiles' secrets.command
      litellm-key:
        type: secret
        name: hermes-litellm
        advancedMounts:
          hermes:
            app:
              - path: /mnt/secrets/litellm
                readOnly: true
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      dashboard:
        hostnames:
          - hermes.bykaj.app
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 9119
      webapp:
        hostnames:
          - chat.bykaj.app
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 9120
            # Streamed replies and websockets stay open
            timeouts:
              request: 0s
    service:
      app:
        ports:
          dashboard:
            appProtocol: kubernetes.io/wss
            port: 9119
          webapp:
            appProtocol: kubernetes.io/wss
            port: 9120
