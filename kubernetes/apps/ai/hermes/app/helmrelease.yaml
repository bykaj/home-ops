---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 60
        strategy: Recreate
        initContainers:
          # 1. The image's config migration, which its own boot hook runs
          #    through `s6-setuidgid hermes`; that needs CAP_SETGID and fails
          #    as non-root. Skipped on first boot, when no config exists yet.
          # 2. Creates the named profiles in HERMES_PROFILES that don't exist
          #    yet, then points the default profile and those at LiteLLM.
          #    Hermes seeds a new profile with Opus through OpenRouter, and
          #    providers and MCP servers have to live in the profile itself,
          #    not in the managed overlay. The provider and the MCP server are
          #    set on every start (Git wins); the model only while the profile
          #    doesn't use LiteLLM yet, so a model picked in the dashboard
          #    survives restarts. $${...} keeps Flux from substituting
          # 3. Named profiles never read credentials from the pod's
          #    environment (multiplexing keeps profiles apart), so they get
          #    the key from the mounted Secret through a secrets.command
          setup:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                if [ -f /opt/data/config.yaml ]; then
                  /opt/hermes/.venv/bin/python /opt/hermes/scripts/docker_config_migrate.py
                fi
                for profile in $HERMES_PROFILES; do
                  if [ ! -d "/opt/data/profiles/$profile" ]; then
                    hermes profile create "$profile" --no-alias >/dev/null 2>&1 || { echo "failed to create profile $profile"; exit 1; }
                    echo "created profile $profile"
                  fi
                done
                # hermes [-p <profile>] config set <key> <value>
                set_key() {
                  if [ "$profile" = default ]; then
                    hermes config set "$1" "$2" >/dev/null 2>&1 || { echo "$profile: failed to set $1"; exit 1; }
                  else
                    hermes -p "$profile" config set "$1" "$2" >/dev/null 2>&1 || { echo "$profile: failed to set $1"; exit 1; }
                  fi
                  echo "$profile: set $1"
                }
                get_key() {
                  if [ "$profile" = default ]; then
                    hermes config get "$1" 2>/dev/null | tail -n 1
                  else
                    hermes -p "$profile" config get "$1" 2>/dev/null | tail -n 1
                  fi
                }
                for profile in default $HERMES_PROFILES; do
                  set_key providers.litellm.name LiteLLM
                  set_key providers.litellm.api http://litellm.ai.svc.cluster.local:4000/v1
                  set_key providers.litellm.key_env LITELLM_API_KEY
                  set_key providers.litellm.discover_models true
                  set_key mcp_servers.litellm.url http://litellm.ai.svc.cluster.local:4000/mcp/
                  set_key mcp_servers.litellm.headers '{"x-litellm-api-key": "Bearer $${LITELLM_API_KEY}"}'
                  if [ "$profile" != default ]; then
                    set_key secrets.command.enabled true
                    set_key secrets.command.command 'echo LITELLM_API_KEY=$(cat /mnt/secrets/litellm/api-key)'
                  fi
                  if [ "$(get_key model.provider)" != "custom:litellm" ]; then
                    set_key model.provider custom:litellm
                    set_key model.default chatgpt/gpt-6.1-sol
                    set_key model.base_url http://litellm.ai.svc.cluster.local:4000/v1
                    # maxInputTokens of the LiteLLM model; Hermes can't read it
                    set_key model.context_length 272000
                  fi
                done
            env:
              HERMES_HOME: /opt/data
              # Named profiles, space-separated; deleting one stays manual
              # (hermes profile delete)
              HERMES_PROFILES: ops
              HOME: /opt/data
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: *image
            # The gateway serves the web app; HERMES_DASHBOARD adds the
            # dashboard as a second s6 service
            args:
              - gateway
              - run
            env:
              # boto3 (model listing) probes the EC2 metadata address
              # 169.254.169.254, which hermes-egress blocks
              AWS_EC2_METADATA_DISABLED: "true"
              HERMES_DASHBOARD: "true"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: "9119"
              # Tools come with the image; installing more needs the internet
              HERMES_DISABLE_LAZY_INSTALLS: "true"
              HERMES_HOME: /opt/data
              HERMES_WRITE_SAFE_ROOT: /opt/data
              HOME: /opt/data
              # Read by the profile (provider key_env, MCP headers); not passed
              # to the terminal, which only gets terminal.env_passthrough
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-litellm
                    key: api-key
              # mise (the image volume below) keeps its tools and its global
              # config on the PVC. The terminal's HOME moves into each profile,
              # so the paths are fixed to share one install between profiles
              MISE_CACHE_DIR: /opt/data/.cache/mise
              MISE_CONFIG_DIR: /opt/data/.config/mise
              MISE_DATA_DIR: /opt/data/.local/share/mise
              MISE_STATE_DIR: /opt/data/.local/state/mise
              # The image's PATH with mise's shims and binary after Hermes' own
              PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/opt/data/.local/share/mise/shims:/opt/mise:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
            # Pocket ID client ID and secret
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              # The gateway's cron ticker writes a heartbeat every 60 s
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /bin/sh
                      - -c
                      - >-
                        hb=$(cut -d. -f1 /opt/data/cron/ticker_heartbeat) &&
                        [ $(( $(date +%s) - hb )) -lt 300 ]
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
            setup:
              - path: /opt/data
      config:
        type: configMap
        name: hermes-configmap
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes
                readOnly: true
      # The mise binary from its image, for installing CLI tools on the PVC;
      # downloads are limited to GitHub by hermes-egress
      mise:
        type: image
        image:
          repository: ghcr.io/jdx/mise
          tag: 2026.11.0@sha256:6e05da4113a812cc8ac72b21a38889d019fb0f97df6ce8075c0de98d1cf48cc4
        advancedMounts:
          hermes:
            app:
              - path: /opt/mise
                readOnly: true
                subPath: usr/local/bin
      # The hermes key as a file, for the named profiles' secrets.command
      litellm-key:
        type: secret
        name: hermes-litellm
        advancedMounts:
          hermes:
            app:
              - path: /mnt/secrets/litellm
                readOnly: true
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      dashboard:
        hostnames:
          - hermes.bykaj.app
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 9119
      webapp:
        hostnames:
          - chat.bykaj.app
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 9120
            # Streamed replies and websockets stay open
            timeouts:
              request: 0s
    service:
      app:
        ports:
          dashboard:
            appProtocol: kubernetes.io/wss
            port: 9119
          webapp:
            appProtocol: kubernetes.io/wss
            port: 9120
