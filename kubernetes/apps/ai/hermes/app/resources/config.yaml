---
# Machine-level overlay at /etc/hermes/config.yaml: it wins over every
# profile's own config.yaml on the PVC. Providers, MCP servers and skills stay
# in the profiles (docs: platforms/kubernetes/ai.md#hermes); declaring them here
# makes every dashboard save strip them from the profile
dashboard:
  oauth:
    provider: self-hosted
    # Client ID and secret come from hermes-secret (HERMES_DASHBOARD_OIDC_*)
    self_hosted:
      issuer: https://cyrannus.id
      scopes: openid profile email
  public_url: https://hermes.bykaj.app

gateway:
  multiplex_profiles: true

# hermes-egress blocks the internet, so these fetches only fired
# CiliumEgressPolicyDenied: the model catalog (hermes-agent.nousresearch.com,
# raw.githubusercontent.com as fallback, every 20 minutes) and the update
# check. The in-image catalog snapshot is used instead; LiteLLM lists the models
model_catalog:
  enabled: false

# The models.dev registry (context windows, prices) has no off switch and is
# retried every 5 minutes by each process; a closed local port makes it fail
# at once without a drop. It has nothing for the LiteLLM names anyway, so the
# profile sets model.context_length itself
models_dev:
  url: http://127.0.0.1:9/api.json

security:
  redact_secrets: true

telemetry:
  shared_metrics:
    enabled: false
    send: false

terminal:
  backend: local
  cwd: /opt/data/workspace

updates:
  check: false

webapp:
  enabled: true
  host: 0.0.0.0
  port: 9120
  public_url: https://chat.bykaj.app
