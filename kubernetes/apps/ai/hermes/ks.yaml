---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
spec:
  components:
    - ../../../../components/kopiur
  # LiteLLMVirtualKey CRD only; the keys themselves wait for the proxy and the
  # hermes and ops teams (litellm-mcp)
  dependsOn:
    - name: litellm-operator
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/ai/hermes/app
  postBuild:
    substitute:
      APP: *app
      # Profiles, sessions, memory, skills and the workspace
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_MOVER_GID: "10000"
      KOPIUR_MOVER_UID: "10000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
