---
# yaml-language-server: $schema=https://schemas.bykaj.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: open-webui
  dependsOn: []
  interval: 1h
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.12.0@sha256:1565038903151ced924b5a3226f73f40f16963df4b910441f6391f10144afdaa
            env:
              # OAuth
              ENABLE_OAUTH_SIGNUP: true
              ENABLE_OAUTH_PERSISTENT_CONFIG: false
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true
              OAUTH_PROVIDER_NAME: "Cetana ID"
              OPENID_PROVIDER_URL: https://auth.cetana.id/application/o/open-webui/.well-known/openid-configuration
              OAUTH_SCOPES: openid email profile
              OPENID_REDIRECT_URI: https://${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.bykaj.app}/oauth/oidc/callback
              # Features
              ENABLE_LOGIN_FORM: false
              ENABLE_OLLAMA_API: false
              ENABLE_OPENAI_API: true
              ENABLE_SIGNUP: false
              ENABLE_WEB_SEARCH: true
              # Search
              WEB_SEARCH_ENGINE: "kagi"
              WEB_SEARCH_RESULT_COUNT: 3
              WEB_SEARCH_CONCURRENT_REQUESTS: 1
              # Websockets
              ENABLE_WEBSOCKET_SUPPORT: true
              WEBSOCKET_MANAGER: redis
              WEBSOCKET_REDIS_URL: "redis://${APP}-dragonfly:6379"
              # LiteLLM
              OPENAI_API_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              # Memini
              MEMINI_BASE_URL: "http://memini.ai.svc.cluster.local:8080"
            envFrom:
              - secretRef:
                  name: open-webui-secret
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 2Gi
    persistence:
      config:
        enabled: true
        existingClaim: "${KOPIUR_CLAIM:=${APP}}"
        globalMounts:
          - path: /app/backend/data
    route:
      app:
        hostnames:
          - "${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.bykaj.app}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: 8080
