---
# yaml-language-server: $schema=https://schemas.bykaj.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: open-webui
  interval: 1h
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.3@sha256:751b617714b91e4cfd0186a509c72480c858e012976103b09a30dad053c36175
            env:
              # OAuth
              ENABLE_OAUTH_SIGNUP: true
              ENABLE_OAUTH_PERSISTENT_CONFIG: false
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true
              OAUTH_PROVIDER_NAME: "Cetana ID"
              OPENID_PROVIDER_URL: https://auth.cetana.id/application/o/open-webui/.well-known/openid-configuration
              OAUTH_SCOPES: openid email profile
              OPENID_REDIRECT_URI: https://${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.${DOMAIN_APP}}/oauth/oidc/callback
              # Features
              ENABLE_LOGIN_FORM: false
              ENABLE_OLLAMA_API: false
              ENABLE_OPENAI_API: false
              ENABLE_SIGNUP: false
              ENABLE_WEB_SEARCH: true
              # Search
              WEB_SEARCH_ENGINE: "kagi"
              WEB_SEARCH_RESULT_COUNT: 3
              WEB_SEARCH_CONCURRENT_REQUESTS: 1
              # Websockets
              ENABLE_WEBSOCKET_SUPPORT: true
              WEBSOCKET_MANAGER: redis
            envFrom:
              - secretRef:
                  name: open-webui-secret
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 1Gi
    persistence:
      config:
        enabled: true
        existingClaim: "${KOPIUR_CLAIM:=${APP}}"
        globalMounts:
          - path: /app/backend/data
    route:
      app:
        hostnames:
          - "${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.${DOMAIN_APP}}"
        parentRefs:
          - name: envoy-external
            namespace: network
    service:
      app:
        ports:
          http:
            port: 8080
