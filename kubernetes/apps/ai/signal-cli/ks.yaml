---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app signal-cli
spec:
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/ai/signal-cli/app
  postBuild:
    substitute:
      APP: *app
      # The account's keys and state: losing them means registering the
      # number again
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_MOVER_GID: "999"
      KOPIUR_MOVER_UID: "999"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
