---
# yaml-language-server: $schema=https://schemas.bykaj.io/litellm.home-operations.com/litellmteam_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: claude-code
spec:
  alias: claude-code
  # Virtual keys get no MCP servers unless granted
  mcpServers:
    - home_assistant
    - kguardian
    - kubesearch
    - unifi_network
  # LiteLLM's "no models" value: it matches no model name, so every model
  # call is refused (403) while MCP access is unaffected
  models:
    - no-default-models
  proxyRef: litellm
