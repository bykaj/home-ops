---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-network-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unifi-network-mcp-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        UNIFI_NETWORK_PASSWORD: "{{ .UNIFI_CLAUDE_PASSWORD }}"
  dataFrom:
    - extract:
        key: unifi
