---
# yaml-language-server: $schema=https://schemas.bykaj.io/v1/serviceaccount.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubectl-mcp
---
# yaml-language-server: $schema=https://schemas.bykaj.io/rbac.authorization.k8s.io/clusterrolebinding_v1.json
# Read only: the built-in view role plus flux-mcp-read (../flux/rbac.yaml), the
# same reading the flux server has. No Secrets, pods/exec, port-forward, node
# proxy or ServiceAccount tokens, so the server's tools for those just fail
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubectl-mcp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kubectl-mcp
    namespace: ai
---
# yaml-language-server: $schema=https://schemas.bykaj.io/rbac.authorization.k8s.io/clusterrolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubectl-mcp-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-mcp-read
subjects:
  - kind: ServiceAccount
    name: kubectl-mcp
    namespace: ai
