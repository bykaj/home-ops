---
# yaml-language-server: $schema=https://schemas.bykaj.io/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: kubesearch-mcp
spec:
  alias: kubesearch
  proxyRef: litellm
  transport: http
  workload:
    # renovate: datasource=docker depName=ghcr.io/perfectra1n/kubesearch-mcp
    image: ghcr.io/perfectra1n/kubesearch-mcp:1.3.0@sha256:4620f09fffb30672b429b9bbffb8a657d34dcee420729598c3f65732a3c89079
    env:
      # Clones stay on GitHub, matching the egress policy
      - name: KUBESEARCH_CLONE_ALLOWED_HOSTS
        value: github.com
      # Always-cloned repos for repo_grep_all: the reference repos
      - name: KUBESEARCH_POOL_REPOS
        value: bjw-s-labs/home-ops,buroa/home-ops,eleboucher/homelab,joryirving/home-ops,nicolerenee/infra,onedr0p/home-ops
    path: /mcp
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    port: 3000
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 1Gi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    volumeMounts:
      - name: data
        mountPath: /data
      - name: tmp
        mountPath: /tmp
    volumes:
      # kubesearch.dev databases (~45 MB) and repo clones, re-downloaded on restart
      - name: data
        emptyDir:
          sizeLimit: 2Gi
      - name: tmp
        emptyDir: {}
