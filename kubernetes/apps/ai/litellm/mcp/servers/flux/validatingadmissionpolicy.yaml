---
# yaml-language-server: $schema=https://schemas.bykaj.io/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
# The Flux controllers deploy whatever a Flux object points at as cluster-admin,
# so a free patch would be cluster-admin too (another repo URL, path or values).
# flux-mcp may only touch the reconcile.fluxcd.io/* annotations (reconcile,
# force, reset) and spec.suspend; labels, owner references and finalizers stay
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: flux-mcp-flux-objects
spec:
  failurePolicy: Fail
  matchConditions:
    - name: flux-mcp
      expression: request.userInfo.username == "system:serviceaccount:ai:flux-mcp"
  matchConstraints:
    resourceRules:
      - apiGroups:
          - helm.toolkit.fluxcd.io
          - kustomize.toolkit.fluxcd.io
          - source.toolkit.fluxcd.io
        apiVersions:
          - "*"
        operations:
          - CREATE
          - DELETE
          - UPDATE
        resources:
          - "*"
  validations:
    - expression: request.operation == "UPDATE"
      message: flux-mcp may only update Flux objects
    - expression: >-
        request.operation != "UPDATE" || (
        object.spec.all(k, k == "suspend" || (k in oldObject.spec && object.spec[k] == oldObject.spec[k])) &&
        oldObject.spec.all(k, k == "suspend" || k in object.spec))
      message: only spec.suspend may change
    - expression: >-
        request.operation != "UPDATE" || (
        variables.newAnnotations.all(k, k.startsWith("reconcile.fluxcd.io/") || (k in variables.oldAnnotations && variables.oldAnnotations[k] == variables.newAnnotations[k])) &&
        variables.oldAnnotations.all(k, k.startsWith("reconcile.fluxcd.io/") || k in variables.newAnnotations))
      message: only reconcile.fluxcd.io/* annotations may change
    - expression: >-
        request.operation != "UPDATE" || (
        (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) &&
        (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []) == (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : []) &&
        (has(object.metadata.finalizers) ? object.metadata.finalizers : []) == (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : []))
      message: labels, owner references and finalizers may not change
  variables:
    - name: newAnnotations
      expression: 'request.operation == "UPDATE" && has(object.metadata.annotations) ? object.metadata.annotations : {}'
    - name: oldAnnotations
      expression: 'request.operation == "UPDATE" && has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}'
---
# yaml-language-server: $schema=https://schemas.bykaj.io/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
# A free patch on a Deployment or StatefulSet could swap its image and run code
# with that app's Secrets. flux-mcp may only change spec.replicas and the
# pod template's kubectl.kubernetes.io/restartedAt annotation (rollout restart)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: flux-mcp-workloads
spec:
  failurePolicy: Fail
  matchConditions:
    - name: flux-mcp
      expression: request.userInfo.username == "system:serviceaccount:ai:flux-mcp"
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - "*"
        operations:
          - CREATE
          - DELETE
          - UPDATE
        # The scale subresources aren't in its role at all
        resources:
          - deployments
          - statefulsets
  validations:
    - expression: request.operation == "UPDATE"
      message: flux-mcp may only update Deployments and StatefulSets
    - expression: >-
        request.operation != "UPDATE" || (
        object.spec.all(k, k == "replicas" || k == "template" || (k in oldObject.spec && object.spec[k] == oldObject.spec[k])) &&
        oldObject.spec.all(k, k == "replicas" || k == "template" || k in object.spec) &&
        object.spec.template.spec == oldObject.spec.template.spec &&
        (has(object.spec.template.metadata.labels) ? object.spec.template.metadata.labels : {}) == (has(oldObject.spec.template.metadata.labels) ? oldObject.spec.template.metadata.labels : {}))
      message: only spec.replicas and the pod template's restartedAt annotation may change
    - expression: >-
        request.operation != "UPDATE" || (
        variables.newTemplateAnnotations.all(k, k == "kubectl.kubernetes.io/restartedAt" || (k in variables.oldTemplateAnnotations && variables.oldTemplateAnnotations[k] == variables.newTemplateAnnotations[k])) &&
        variables.oldTemplateAnnotations.all(k, k == "kubectl.kubernetes.io/restartedAt" || k in variables.newTemplateAnnotations))
      message: only the pod template's restartedAt annotation may change
    - expression: >-
        request.operation != "UPDATE" || (
        (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) &&
        (has(object.metadata.annotations) ? object.metadata.annotations : {}) == (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}) &&
        (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []) == (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : []) &&
        (has(object.metadata.finalizers) ? object.metadata.finalizers : []) == (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : []))
      message: labels, annotations, owner references and finalizers may not change
  variables:
    - name: newTemplateAnnotations
      expression: 'request.operation == "UPDATE" && has(object.spec.template.metadata.annotations) ? object.spec.template.metadata.annotations : {}'
    - name: oldTemplateAnnotations
      expression: 'request.operation == "UPDATE" && has(oldObject.spec.template.metadata.annotations) ? oldObject.spec.template.metadata.annotations : {}'
---
# yaml-language-server: $schema=https://schemas.bykaj.io/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: flux-mcp-flux-objects
spec:
  policyName: flux-mcp-flux-objects
  validationActions:
    - Deny
---
# yaml-language-server: $schema=https://schemas.bykaj.io/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: flux-mcp-workloads
spec:
  policyName: flux-mcp-workloads
  validationActions:
    - Deny
