---
# yaml-language-server: $schema=https://schemas.bykaj.io/litellm.home-operations.com/litellmteam_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: hermes
spec:
  alias: hermes
  # Hermes is the ops agent for the cluster, the network and Home Assistant, so
  # it gets every server, flux's write access included. kagi is its web search
  # (paid per search); its pod may reach nothing outside the cluster
  mcpServers:
    - context7
    - flux
    - home_assistant
    - kagi
    - kguardian
    - kubesearch
    - unifi_network
  # Subscription models first, MiniMax as the pay-per-token fallback
  models:
    - chatgpt/gpt-6-luna
    - chatgpt/gpt-6.1-sol
    - minimax/MiniMax-M3
    - minimax/MiniMax-M3.1-Flash
  proxyRef: litellm
