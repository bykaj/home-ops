---
# yaml-language-server: $schema=https://schemas.bykaj.io/litellm.home-operations.com/litellmteam_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: ops
spec:
  alias: ops
  # Write-capable cluster access, kept off every other team so a leaked
  # read-mostly key can't change the cluster. Its keys belong to the clients
  # that fix things (hermes-ops in ai/hermes)
  mcpServers:
    - flux
  # LiteLLM's "no models" value: every model call is refused (403), MCP access
  # is unaffected
  models:
    - no-default-models
  proxyRef: litellm
