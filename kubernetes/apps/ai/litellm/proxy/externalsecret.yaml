---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GENERIC_CLIENT_ID: "{{ .LL_OIDC_CLIENT_ID }}"
        GENERIC_CLIENT_SECRET: "{{ .LL_OIDC_CLIENT_SECRET }}"
        HA_MCP_URL: "{{ .LL_HA_MCP_URL }}"
        LITELLM_MASTER_KEY: "{{ .LL_LITELLM_MASTER_KEY }}"
        LITELLM_SALT_KEY: "{{ .LL_LITELLM_SALT_KEY }}"
        MINIMAX_API_KEY: "{{ .LL_MINIMAX_API_KEY }}"
  dataFrom:
    - extract:
        key: litellm
      rewrite: [{ regexp: { source: (.*), target: LL_$1 } }]
