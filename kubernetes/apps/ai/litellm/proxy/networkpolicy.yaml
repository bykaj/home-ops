---
# yaml-language-server: $schema=https://schemas.bykaj.io/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-egress
spec:
  # Egress only: the proxy holds every provider key, so it may reach the model
  # providers, its cache, its database, its MCP servers and Pocket ID and nothing
  # else (BerriAI/litellm#47826)
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            app: litellm-dragonfly
            app.kubernetes.io/name: dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: litellm-postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # MCP servers run by the operator (litellm/mcp); add the port here when
    # adding a server on a new one
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: mcp-server
            app.kubernetes.io/managed-by: litellm-operator
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # kguardian's /mcp on its llm-bridge (litellm/mcp/kguardian)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kguardian-llm-bridge
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Pocket ID for Admin UI SSO: cyrannus.id resolves to the envoy-external
    # LoadBalancer IP, which Cilium translates to the envoy pods (10443)
    - toEndpoints:
        - matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
            k8s:io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # Model providers; add the host here when adding a model with a new apiBase
    - toFQDNs:
        - matchName: api.minimax.io
        - matchName: api.openai.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # External MCP servers (litellm/mcp); add the host here when adding one
    # with a new url
    - toFQDNs:
        - matchName: mcp.context7.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: litellm
      app.kubernetes.io/name: litellm
