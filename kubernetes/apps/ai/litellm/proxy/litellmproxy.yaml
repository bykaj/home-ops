---
# yaml-language-server: $schema=https://schemas.bykaj.io/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # renovate: datasource=docker depName=docker.io/litellm/litellm
  image: docker.io/litellm/litellm:v1.106.2@sha256:7294b90f868c5c38c99b83021c7ba46f9b439e95f8e32964c925c7d2563a03f7
  replicas: 1
  # Admin API for DB-backed resources (LiteLLMVirtualKey); models and MCP
  # servers stay file-backed because applyMode is left at its default
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
  generalSettings:
    # Pocket ID (SSO) is the only Admin UI login, and the login page goes
    # straight to it; the master key no longer works as the UI password but
    # still authenticates API calls
    auto_redirect_ui_login_to_sso: true
    disable_env_credential_login: true
    health_check_endpoint: /v1/health
    # Envoy (pod network) appends the caller's address to X-Forwarded-For; the
    # route is on envoy-internal only, so the rightmost entry is the real
    # client. Used for MCP access control and the UI login throttle
    mcp_trusted_proxy_ranges:
      - 10.42.0.0/16
    mcp_xff_num_trusted_hops: 1
    store_model_in_db: false
    trusted_proxy_ranges:
      - 10.42.0.0/16
    use_x_forwarded_for: true
  routerSettings:
    routing_strategy: simple-shuffle
    redis_url: os.environ/REDIS_URL
    num_retries: 3
    timeout: 600
  litellmSettings:
    success_callback:
      - prometheus
    prometheus_adapter: true
    cache: true
    cache_params:
      type: redis
      url: os.environ/REDIS_URL
    drop_params: true
    merge_reasoning_content_in_choices: true
    set_verbose: false
  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: ${APP}-postgres-app
          key: uri
    # Admin UI SSO through Pocket ID; LiteLLM's free tier allows up to 5 SSO users
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://cyrannus.id/authorize
    - name: GENERIC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: GENERIC_CLIENT_ID
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: GENERIC_CLIENT_SECRET
    - name: GENERIC_CLIENT_USE_PKCE
      value: "true"
    - name: GENERIC_SCOPE
      value: openid profile email
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://cyrannus.id/api/oidc/token
    - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
      value: name
    - name: GENERIC_USER_EMAIL_ATTRIBUTE
      value: email
    - name: GENERIC_USER_ID_ATTRIBUTE
      value: sub
    # Pocket ID custom claim; proxy_admin for admins
    - name: GENERIC_USER_ROLE_ATTRIBUTE
      value: litellm_role
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://cyrannus.id/api/oidc/userinfo
    # ha-mcp on the HA Yellow (litellm/mcp/home-assistant); the webhook ID in
    # the URL is its only credential, so the URL stays in the Secret and the
    # config refers to it as os.environ/HA_MCP_URL
    - name: HA_MCP_URL
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: HA_MCP_URL
    - name: PROXY_BASE_URL
      value: https://${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.bykaj.app}
    # Use the bundled blog posts for the Admin UI: the RSS fetch is synchronous,
    # so with docs.litellm.ai blocked by the egress policy every UI page load
    # froze the whole proxy for the 5s timeout (failures aren't cached)
    - name: LITELLM_LOCAL_BLOG_POSTS
      value: "true"
    # Use the bundled cost map instead of fetching it from GitHub at startup;
    # the egress policy only allows the model providers
    - name: LITELLM_LOCAL_MODEL_COST_MAP
      value: "True"
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: LITELLM_MASTER_KEY
    # Encrypts credentials stored in the database; must never change once
    # the database holds data
    - name: LITELLM_SALT_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: LITELLM_SALT_KEY
    - name: REDIS_URL
      value: "redis://${APP}-dragonfly:6379"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  service:
    type: ClusterIP
    port: 4000
  route:
    hostnames:
      - "${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.bykaj.app}"
    parentRefs:
      - name: envoy-internal
        namespace: network
