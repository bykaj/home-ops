---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm
spec:
  components:
    - ../../../../components/database/dragonfly
    - ../../../../components/kopiur
    - ../../../../components/database/postgres
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: dragonfly-operator
      namespace: database
    - name: litellm-operator
    - name: rook-ceph-cluster
      namespace: rook-ceph
  # Only evaluated for the resources listed in healthChecks; current-only, so
  # a database that is still starting counts as in progress, not failed
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      current: has(status.phase) && status.phase == 'Ready'
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: has(status.conditions) && status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  healthChecks:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      name: litellm-dragonfly
      namespace: ai
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: litellm-postgres
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/litellm/app
  postBuild:
    substitute:
      APP: *app
      # ChatGPT token PVC; the proxy runs as root and writes auth.json
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_MOVER_GID: "0"
      KOPIUR_MOVER_UID: "0"
      POSTGRES_BACKUP_SCHEDULE: "4 0 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm-mcp
spec:
  dependsOn:
    - name: litellm
  interval: 1h
  path: ./kubernetes/apps/ai/litellm/mcp
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
