---
# yaml-language-server: $schema=https://schemas.bykaj.io/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: minimax-m3-anthropic
spec:
  info:
    extra:
      supports_reasoning: true
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
  modelName: minimax/MiniMax-M3-anthropic
  params:
    additional:
      cache_control_injection_points:
        - location: message
          role: system
        - index: -1
          location: message
      # Official per-token prices (platform.minimax.io/docs/guides/pricing, standard
      # tier); set here because LiteLLM's bundled cost map has no anthropic/ entry
      # and no >512K tier. No cache write price is listed, so writes count as free
      cache_read_input_token_cost: 0.00000006 # $0.06/M
      cache_read_input_token_cost_above_512k_tokens: 0.00000012 # $0.12/M
      input_cost_per_token: 0.0000003 # $0.30/M
      input_cost_per_token_above_512k_tokens: 0.0000006 # $0.60/M
      output_cost_per_token: 0.0000012 # $1.20/M
      output_cost_per_token_above_512k_tokens: 0.0000024 # $2.40/M
    apiBase: https://api.minimax.io/anthropic
    apiKeyRef:
      key: MINIMAX_API_KEY
      name: litellm-secret
    dropParams: true
    model: anthropic/MiniMax-M3
