---
# yaml-language-server: $schema=https://schemas.bykaj.io/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # renovate: datasource=docker depName=docker.io/litellm/litellm
  image: docker.io/litellm/litellm:v1.109.0@sha256:26aecfb02fb17ac6590f0549478561f9fbb3f69314317320b2e32a21beed4006
  replicas: 1
  # Admin API for DB-backed resources (LiteLLMVirtualKey); models and MCP
  # servers stay file-backed because applyMode is left at its default
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
  generalSettings:
    # Enables the email channel (key created, user invited and the UI's test
    # email); without it LiteLLM skips every email, even with SMTP configured
    alerting:
      - email
    # Pocket ID (SSO) is the only Admin UI login, and the login page goes
    # straight to it; neither the master key nor a database user's password
    # works for /login, but the master key still authenticates API calls
    # (UI recovery if Pocket ID is down: drop both disable_* settings and log
    # in with the master key)
    auto_redirect_ui_login_to_sso: true
    disable_env_credential_login: true
    disable_password_login_when_sso_enabled: true
    health_check_endpoint: /v1/health
    # Envoy (pod network) appends the caller's address to X-Forwarded-For; the
    # route is on envoy-internal only, so the rightmost entry is the real
    # client. Used for MCP access control and the UI login throttle
    mcp_trusted_proxy_ranges:
      - 10.42.0.0/16
    mcp_xff_num_trusted_hops: 1
    store_model_in_db: false
    trusted_proxy_ranges:
      - 10.42.0.0/16
    use_x_forwarded_for: true
  routerSettings:
    routing_strategy: simple-shuffle
    redis_url: os.environ/REDIS_URL
    num_retries: 3
    timeout: 600
  litellmSettings:
    success_callback:
      - prometheus
    prometheus_adapter: true
    cache: true
    cache_params:
      type: redis
      url: os.environ/REDIS_URL
    drop_params: true
    merge_reasoning_content_in_choices: true
    set_verbose: false
  env:
    # ChatGPT subscription login (chatgpt/ models): auth.json is copied in by
    # hand once and the proxy rewrites it on every token refresh, so it lives
    # on the Kopiur-backed PVC
    - name: CHATGPT_TOKEN_DIR
      value: /app/chatgpt_tokens
    # The Prisma CLI that LiteLLM runs at startup phones home to
    # checkpoint.prisma.io (version check and telemetry); litellm-egress
    # blocks it, which set off CiliumEgressPolicyDenied
    - name: CHECKPOINT_DISABLE
      value: "1"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: ${APP}-postgres-app
          key: uri
    # Admin UI SSO through Pocket ID; LiteLLM's free tier allows up to 5 SSO users
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://cyrannus.id/authorize
    - name: GENERIC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: GENERIC_CLIENT_ID
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: GENERIC_CLIENT_SECRET
    - name: GENERIC_CLIENT_USE_PKCE
      value: "true"
    - name: GENERIC_SCOPE
      value: openid profile email
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://cyrannus.id/api/oidc/token
    - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
      value: name
    - name: GENERIC_USER_EMAIL_ATTRIBUTE
      value: email
    - name: GENERIC_USER_ID_ATTRIBUTE
      value: sub
    # Pocket ID custom claim; proxy_admin for admins
    - name: GENERIC_USER_ROLE_ATTRIBUTE
      value: litellm_role
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://cyrannus.id/api/oidc/userinfo
    - name: PROXY_BASE_URL
      value: https://${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.bykaj.app}
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    # Stop every fetch LiteLLM makes on its own (cost map, Admin UI blog posts
    # and release check, HIBP, tokenizers) and use the bundled copies; the
    # egress policy only allows the configured destinations, and the blocked
    # blog fetch used to freeze the whole proxy on every UI page load
    - name: LITELLM_OFFLINE_MODE
      value: "true"
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: LITELLM_MASTER_KEY
    # Encrypts credentials stored in the database; must never change once
    # the database holds data
    - name: LITELLM_SALT_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: LITELLM_SALT_KEY
    - name: REDIS_URL
      value: "redis://${APP}-dragonfly:6379"
    # Email alerts and notifications through the in-cluster relay, which takes
    # unauthenticated plain SMTP (no STARTTLS)
    - name: SMTP_HOST
      value: smtp.bykaj.io
    - name: SMTP_PORT
      value: "25"
    - name: SMTP_SENDER_EMAIL
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: SMTP_SENDER_EMAIL
    - name: SMTP_TLS
      value: "False"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  # The operator's Deployment rolls out with a surge pod (no strategy field)
  # and the token PVC is ReadWriteOnce: keep the new pod on the old pod's node
  # so the volume can attach there. With no other litellm pod (first start,
  # drain) the scheduler's self-match rule lets it go anywhere
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/instance: litellm
              app.kubernetes.io/name: litellm
          topologyKey: kubernetes.io/hostname
  volumeMounts:
    - name: chatgpt-tokens
      mountPath: /app/chatgpt_tokens
  volumes:
    - name: chatgpt-tokens
      persistentVolumeClaim:
        claimName: ${APP}
  service:
    type: ClusterIP
    port: 4000
  route:
    hostnames:
      - "${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.bykaj.app}"
    parentRefs:
      - name: envoy-internal
        namespace: network
