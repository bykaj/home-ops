---
# yaml-language-server: $schema=https://schemas.bykaj.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-resource-driver
spec:
  chartRef:
    kind: OCIRepository
    name: intel-gpu-resource-driver
  interval: 1h
  values:
    cdi:
      staticPath: /var/cdi/static
      dynamicPath: /var/cdi/dynamic
    kubeletPlugin:
      privileged: true
      healthMonitoring:
        enabled: false
      # 0.11 defaults manageBinding on (VFIO/KubeVirt GPU passthrough binding).
      # We only use iGPUs for transcoding, so keep the driver out of binding
      # management to preserve 0.10 behavior.
      manageBinding:
        enabled: false
