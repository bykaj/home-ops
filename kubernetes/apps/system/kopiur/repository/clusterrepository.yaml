---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          server: ${NAS_HOST}
          path: /mnt/vault/Backups/Cluster/main/kopiur
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: system
      key: KOPIA_PASSWORD
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  maintenance:
    enabled: true
    takeoverPolicy: Force
    # A run wedged on dead NFSv4 state hangs forever (0 CPU, D-state unlinks);
    # kill it after 6h so the next scheduled run gets a fresh mount
    failurePolicy:
      activeDeadlineSeconds: 21600
  moverDefaults:
    podSecurityContext:
      fsGroup: 4000
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      runAsUser: 4000
      runAsGroup: 4000
    ttlSecondsAfterFinished: 300
  # Busy repo (~30 apps x hourly): let epochs close sooner than Kopia's 24h
  # default so index-blob compaction keeps up (TooManyIndexBlobs warning)
  parameters:
    epoch:
      minDuration: 6h
  scheduleDefaults:
    timezone: ${TIMEZONE}
  # Built-in kopia web UI
  server:
    namespace: system
    readOnly: false
    podSecurityContext:
      runAsUser: 4000
      runAsGroup: 4000
      fsGroup: 4000
