---
# yaml-language-server: $schema=https://schemas.bykaj.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 4000
      runAsGroup: 4000
      fsGroup: 4000
      fsGroupChangePolicy: OnRootMismatch
    extraVolumes:
      - name: repo
        nfs:
          server: ${NAS_HOST}
          path: /mnt/vault/Backups/Cluster/main/kopiur
    extraVolumeMounts:
      - name: repo
        mountPath: /repo
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
