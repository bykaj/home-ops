---
# yaml-language-server: $schema=https://schemas.bykaj.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    # Grants the operator ClusterRole secrets create/patch so it can project
    # the repository credentials into mover namespaces (credentialProjection)
    features:
      credentialProjection:
        enabled: true
      kopiaUi:
        enabled: true
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    # Operator runs as the same UID as the movers so catalog scans against the
    # NFS-backed repository (owned by 4000) succeed
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 4000
      runAsGroup: 4000
      fsGroup: 4000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
