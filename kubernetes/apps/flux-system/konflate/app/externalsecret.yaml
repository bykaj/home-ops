---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: konflate-secret
    template:
      data:
        KONFLATE_WEBHOOK_SECRET: "{{ .KF_KONFLATE_WEBHOOK_SECRET }}"
        KONFLATE_APP_CLIENT_ID: "{{ .GH_GITHUB_BOT_APP_CLIENT_ID }}"
        KONFLATE_APP_PRIVATE_KEY: "{{ .GH_GITHUB_BOT_APP_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: konflate
      rewrite: [{ regexp: { source: (.*), target: KF_$1 } }]
    - extract:
        key: github-bot
      rewrite: [{ regexp: { source: (.*), target: GH_$1 } }]
