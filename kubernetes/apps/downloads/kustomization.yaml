---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
components:
  - ../../components/namespace
  - ../../components/kopiur/secret
patches:
  - target:
      kind: Namespace
    patch: |
      - op: add
        path: /metadata/annotations/kopiur.home-operations.com~1privileged-movers
        value: "true"
replacements:
  - path: ../../components/replacements/ks.yaml
resources:
  - ./autobrr/ks.yaml
  - ./bazarr/ks.yaml
  - ./configarr/ks.yaml
  - ./prowlarr/ks.yaml
  # - ./radarr/ks.yaml
  # - ./sabnzbd/ks.yaml
  - ./sonarr/ks.yaml
  # - ./whisparr/ks.yaml
