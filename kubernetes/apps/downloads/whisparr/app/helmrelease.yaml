---
# yaml-language-server: $schema=https://schemas.bykaj.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app whisparr
spec:
  chartRef:
    kind: OCIRepository
    name: whisparr
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/hotio/whisparr
              tag: v3-v3.6.5@sha256:d0e644ce607755bd02a51f15d24ca972df5de3106fc8981f5ccb1f9b22fbb8fd
            env:
              PGID: "${APP_GID:-1000}"
              PUID: "${APP_UID:-1000}"
              UMASK: "002"
              WHISPARR__APP__INSTANCENAME: Whisparr
              WHISPARR__APP__THEME: auto
              WHISPARR__AUTH__METHOD: External
              WHISPARR__AUTH__REQUIRED: Enabled
              WHISPARR__LOG__DBENABLED: "False"
              WHISPARR__LOG__LEVEL: info
              WHISPARR__SERVER__ALLOWEDHOSTS: "*"
              WHISPARR__SERVER__PORT: &port 6969
              TZ: "Europe/Amsterdam"
            envFrom:
              - secretRef:
                  name: whisparr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              readOnlyRootFilesystem: false
              runAsGroup: 0
              runAsUser: 0
    persistence:
      config:
        existingClaim: "${KOPIUR_CLAIM:=${APP}}"
        globalMounts:
          - path: /config
      backups:
        type: nfs
        server: "nas.internal"
        path: /mnt/vault/Backups
        globalMounts:
          - path: /mnt/backups
            subPath: Apps/Whisparr
      downloads:
        type: nfs
        server: "nas.internal"
        path: /mnt/vault/Downloads
        globalMounts:
          - path: /mnt/downloads
      media:
        type: nfs
        server: "nas.internal"
        path: /mnt/vault/Private
        globalMounts:
          - path: /mnt/private
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /config/logs
            subPath: logs
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Downloads"
          gethomepage.dev/name: "${APP_NAME}"
          gethomepage.dev/icon: "sh-whisparr.svg"
        hostnames:
          - "${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.bykaj.app}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          # API paths stay reachable for the other apps, still guarded by the API key
          - name: api
            backendRefs:
              - identifier: app
                port: *port
            matches:
              - path:
                  type: PathPrefix
                  value: /api
              - path:
                  type: PathPrefix
                  value: /feed
          # Everything else requires a Pocket ID login (components/gateway-oidc)
          - name: app
            backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
