---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sonarr-secret
    template:
      data:
        SONARR__AUTH__APIKEY: "{{ .SONARR_API_KEY }}"
        SONARR__AUTH__OIDCCLIENTID: "{{ .OIDC_CLIENT_ID }}"
        SONARR__AUTH__OIDCCLIENTSECRET: "{{ .OIDC_CLIENT_SECRET }}"
        # Pocket ID user ID (sub); Sonarr allows exactly one OIDC user
        SONARR__AUTH__OIDCUSERIDENTIFIER: "{{ .OIDC_USER }}"
  dataFrom:
    - extract:
        key: sonarr
