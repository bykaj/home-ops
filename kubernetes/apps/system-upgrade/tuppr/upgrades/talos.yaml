---
# yaml-language-server: $schema=https://schemas.bykaj.io/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.13.9
  policy:
    rebootMode: powercycle
  healthChecks:
    # - apiVersion: volsync.backube/v1alpha1
    #   kind: ReplicationSource
    #   expr: |-
    #     status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        status.phase != 'Running'
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      expr: |-
        !(status.phase in ['Resolving', 'Restoring'])
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      expr: |-
        status.ceph.health in ['HEALTH_OK']
