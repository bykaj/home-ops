---
# yaml-language-server: $schema=https://schemas.bykaj.io/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.14.7
  policy:
    rebootMode: powercycle
  healthChecks:
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        status.phase != 'Running'
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      expr: |-
        !(status.phase in ['Resolving', 'Restoring'])
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      expr: |-
        status.ceph.health in ['HEALTH_OK']
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      expr: |-
        has(status.readyInstances) && status.readyInstances == object.spec.instances &&
        has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
    # Ready doesn't cover a replica that follows another replica, so the GTIDs
    # have to match too (KB-021)
    - apiVersion: k8s.mariadb.com/v1alpha1
      kind: MariaDB
      expr: |-
        has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True') &&
        (!has(object.spec.replication) || (
          has(status.replication) && has(status.replication.replicas) &&
          size(status.replication.replicas) == object.spec.replicas - 1 &&
          status.replication.replicas.all(r,
            status.replication.replicas[r].slaveIORunning &&
            status.replication.replicas[r].slaveSQLRunning &&
            status.replication.replicas.all(o,
              status.replication.replicas[r].gtidCurrentPos == status.replication.replicas[o].gtidCurrentPos))))
