---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: emqx-operator
spec:
  interval: 1h
  path: ./kubernetes/apps/database/emqx/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: emqx-cluster
spec:
  dependsOn:
    - name: emqx-operator
  interval: 1h
  path: ./kubernetes/apps/database/emqx/cluster
  postBuild:
    substitute:
      APP: emqx
      APP_NAME: "EMQX Dashboard"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
