---
# yaml-language-server: $schema=https://schemas.bykaj.io/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: garage-s3
spec:
  configuration:
    data:
      compression: bzip2
    destinationPath: "s3://postgresql/${APP}"
    endpointURL: "https://s3.bykaj.io"
    s3Credentials:
      accessKeyId:
        name: &secret plugin-barman-cloud-secret
        key: S3_ACCESS_KEY_ID
      secretAccessKey:
        name: *secret
        key: S3_SECRET_ACCESS_KEY
      region:
        name: *secret
        key: S3_REGION
    wal:
      compression: bzip2
      maxParallel: 8
  retentionPolicy: 30d
