---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cloudnative-pg-cluster
spec:
  dependsOn:
    - name: cloudnative-pg-operator
    - name: plugin-barman-cloud
  interval: 1h
  path: ./kubernetes/apps/database/cloudnative-pg/cluster/app
  postBuild:
    substitute:
      APP: *app
      CNPG_V18_CURRENT_CLUSTER: "postgres-v18-20260905-01"
      CNPG_V18_PREVIOUS_CLUSTER: "postgres-v18-20260824-01"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
