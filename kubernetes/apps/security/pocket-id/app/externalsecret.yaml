---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pocket-id-secret
    creationPolicy: Owner
    template:
      data:
        ENCRYPTION_KEY: "{{ .PI_ENCRYPTION_KEY }}"
        # Downloads the GeoLite2 City database for sign-in locations
        MAXMIND_LICENSE_KEY: "{{ .PI_MAXMIND_LICENSE_KEY }}"
  dataFrom:
    - extract:
        key: pocket-id
      rewrite: [{ regexp: { source: (.*), target: PI_$1 } }]
