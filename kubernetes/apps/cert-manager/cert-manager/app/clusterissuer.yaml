---
# yaml-language-server: $schema=https://schemas.bykaj.io/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cert-manager-secret
              key: CF_API_TOKEN
        selector:
          dnsZones:
            - bykaj.app
            - bykaj.dev
            - cetana.id
            - drup.lol
            - kaj.pics
---
# yaml-language-server: $schema=https://schemas.bykaj.io/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cluster-ca
spec:
  ca:
    secretName: cluster-ca-secret
---
# yaml-language-server: $schema=https://schemas.bykaj.io/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: postgres-client-ca
spec:
  ca:
    secretName: postgres-client-ca-secret
