---
# yaml-language-server: $schema=https://schemas.bykaj.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nut-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: nut-exporter
  interval: 1h
  values:
    controllers:
      nut-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          nut-exporter:
            image:
              repository: ghcr.io/druggeri/nut_exporter
              tag: 3.3.0@sha256:276460d141c732772f8b1fcd785a7de272473e6d39fd85c32b163efc2999cb9a
            env:
              NUT_EXPORTER__LOG_LEVEL: info
              NUT_EXPORTER_SERVER: 127.0.0.1
              NUT_EXPORTER_VARIABLES: >-
                battery.charge,battery.runtime,battery.voltage,input.frequency,input.voltage,input.voltage.nominal,output.current,output.voltage,ups.load,ups.power,ups.realpower,ups.realpower.nominal,ups.status,ups.temperature
              TZ: Europe/Amsterdam
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          # Repeater driver (daemonized) mirrors the UniFi UPS NUT server into a
          # local socket; upsd serves it on localhost for nut-exporter
          nut-upsd:
            image:
              repository: docker.io/instantlinux/nut-upsd
              tag: 2.8.5-r1@sha256:28eae8f3c097b409749ed4a50da57668cf8785a9bccf0db83e521bf343c0e97e
            command:
              - sh
              - -c
              - /usr/lib/nut/dummy-ups -a ups-2u && exec /usr/sbin/upsd -F
            env:
              NUT_ALTPIDPATH: /run/nut
              NUT_CONFPATH: /etc/nut
              NUT_STATEPATH: /run/nut
            # dummy-ups never notices when the UniFi UPS reboots and drops the
            # session silently, and runs unsupervised in the background; restart
            # the container once upsd reports the data as stale
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["upsc", "ups-2u@127.0.0.1", "ups.status"]
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 4
            securityContext: *securityContext
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    persistence:
      config:
        type: configMap
        name: nut-exporter-configmap
        advancedMounts:
          nut-exporter:
            nut-upsd:
              - path: /etc/nut
                readOnly: true
      state:
        type: emptyDir
        advancedMounts:
          nut-exporter:
            nut-upsd:
              - path: /run/nut
    service:
      nut-exporter:
        controller: nut-exporter
        ports:
          metrics:
            protocol: TCP
            port: 9199
