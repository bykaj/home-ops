---
# yaml-language-server: $schema=https://schemas.bykaj.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nut-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: nut-exporter
  interval: 1h
  values:
    controllers:
      nut-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          nut-exporter:
            image:
              repository: ghcr.io/druggeri/nut_exporter
              tag: 3.3.0@sha256:276460d141c732772f8b1fcd785a7de272473e6d39fd85c32b163efc2999cb9a
            env:
              NUT_EXPORTER__LOG_LEVEL: debug
              NUT_EXPORTER_SERVER: 127.0.0.1
              NUT_EXPORTER_VARIABLES: >-
                battery.charge,battery.runtime,battery.voltage,input.frequency,input.voltage,input.voltage.nominal,output.current,output.voltage,ups.load,ups.power,ups.realpower,ups.realpower.nominal,ups.status,ups.temperature
              TZ: Europe/Amsterdam
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          # Repeater driver: mirrors the UniFi UPS NUT server into a local socket
          nut-driver:
            image: &nutImage
              repository: docker.io/instantlinux/nut-upsd
              tag: 2.8.5-r1@sha256:a4a68e3c56081e3187621ee2a4bf9bce2936eaf0b628c01f81881f25cee0e667
            command: ["/usr/lib/nut/dummy-ups", "-a", "ups-2u", "-F"]
            env: &nutEnv
              NUT_ALTPIDPATH: /run/nut
              NUT_CONFPATH: /etc/nut
              NUT_STATEPATH: /run/nut
            securityContext: *securityContext
          # Full upsd serving the relayed UPS on localhost for nut-exporter
          nut-upsd:
            image: *nutImage
            command: ["/usr/sbin/upsd", "-F"]
            env: *nutEnv
            securityContext: *securityContext
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    persistence:
      config:
        type: configMap
        name: nut-exporter-configmap
        advancedMounts:
          nut-exporter:
            nut-driver: &configMount
              - path: /etc/nut
                readOnly: true
            nut-upsd: *configMount
      state:
        type: emptyDir
        advancedMounts:
          nut-exporter:
            nut-driver: &stateMount
              - path: /run/nut
            nut-upsd: *stateMount
    service:
      nut-exporter:
        controller: nut-exporter
        ports:
          metrics:
            protocol: TCP
            port: 9199
