---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kguardian
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kguardian-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        api-key: "{{ .LL_LITELLM_MASTER_KEY }}"
  dataFrom:
    - extract:
        key: litellm
      rewrite: [{ regexp: { source: (.*), target: LL_$1 } }]
