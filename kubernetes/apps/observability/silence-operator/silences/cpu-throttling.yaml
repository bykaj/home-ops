---
# yaml-language-server: $schema=https://schemas.bykaj.io/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: cpu-throttling
spec:
  matchers:
    # Smoll CPU's causing throttling (during bootstrapping). I know, don't need the reminder...
    - name: alertname
      value: CPUThrottlingHigh
