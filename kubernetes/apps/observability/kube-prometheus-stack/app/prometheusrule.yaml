---
# yaml-language-server: $schema=https://schemas.bykaj.io/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nvme
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  groups:
    - name: nvme.rules
      rules:
        - alert: NvmeTemperatureHigh
          annotations:
            description: >-
              {{ $labels.model }} ({{ $labels.chip }}) on {{ $labels.nodename }} is at {{ $value | humanize }}°C,
              within 2°C of its warning threshold. For the k8s-03 Micron, consider `just talos nvme-power k8s-03`.
            summary: NVMe drive is running hot.
          expr: |
            (
              node_hwmon_temp_celsius{chip=~"nvme_.+",sensor="temp1"}
              >= on (instance, chip, sensor)
              (node_hwmon_temp_max_celsius{chip=~"nvme_.+",sensor="temp1"} - 2)
            )
            * on (instance, chip) group_left (model, serial)
              label_replace(node_nvme_info, "chip", "nvme_$1", "device", "(.+)")
            * on (instance) group_left (nodename) node_uname_info
          for: 5m
          labels:
            severity: warning
        - alert: NvmeTemperatureCritical
          annotations:
            description: >-
              {{ $labels.model }} ({{ $labels.chip }}) on {{ $labels.nodename }} is at {{ $value | humanize }}°C,
              at or above its warning threshold. The drive may throttle or refuse I/O. For the k8s-03 Micron,
              run `just talos nvme-power k8s-03` and/or pause Ceph recovery (`ceph osd set nobackfill/norecover`).
            summary: NVMe drive is overheating.
          expr: |
            (
              node_hwmon_temp_celsius{chip=~"nvme_.+",sensor="temp1"}
              >= on (instance, chip, sensor)
              node_hwmon_temp_max_celsius{chip=~"nvme_.+",sensor="temp1"}
            )
            * on (instance, chip) group_left (model, serial)
              label_replace(node_nvme_info, "chip", "nvme_$1", "device", "(.+)")
            * on (instance) group_left (nodename) node_uname_info
          for: 1m
          labels:
            severity: critical
