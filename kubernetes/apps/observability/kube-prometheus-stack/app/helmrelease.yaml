---
# yaml-language-server: $schema=https://schemas.bykaj.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: flux-metrics-configmap
      valuesKey: flux-metrics.yaml
  values:
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - alertmanager.bykaj.app
          parentRefs:
            - name: envoy-internal
              namespace: network
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
        externalUrl: https://alertmanager.bykaj.app
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.bykaj.app
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        # TODO: remove when k8s-03 NIC is upgraded
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - k8s-01
                        - k8s-02
        externalUrl: https://prometheus.bykaj.app
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 30d
        retentionSize: 40GiB
        resources:
          requests:
            cpu: 50m
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 50Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: observability
        matchLabels:
          dashboards: grafana
    additionalPrometheusRulesMap:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      nvme-rules:
        groups:
          - name: nvme
            rules:
              - alert: NvmeTemperatureHigh
                annotations:
                  description: >-
                    {{ $labels.model }} ({{ $labels.chip }}) on {{ $labels.nodename }} is at {{ $value | humanize }}°C,
                    within 2°C of its warning threshold. For the k8s-03 Micron, consider `just talos nvme-power k8s-03`.
                  summary: NVMe drive is running hot.
                expr: |
                  (
                    node_hwmon_temp_celsius{chip=~"nvme_.+",sensor="temp1"}
                    >= on (instance, chip, sensor)
                    (node_hwmon_temp_max_celsius{chip=~"nvme_.+",sensor="temp1"} - 2)
                  )
                  * on (instance, chip) group_left (model, serial)
                    label_replace(node_nvme_info, "chip", "nvme_$1", "device", "(.+)")
                  * on (instance) group_left (nodename) node_uname_info
                for: 5m
                labels:
                  severity: warning
              - alert: NvmeTemperatureCritical
                annotations:
                  description: >-
                    {{ $labels.model }} ({{ $labels.chip }}) on {{ $labels.nodename }} is at {{ $value | humanize }}°C,
                    at or above its warning threshold. The drive may throttle or refuse I/O. For the k8s-03 Micron,
                    run `just talos nvme-power k8s-03` and/or pause Ceph recovery (`ceph osd set nobackfill/norecover`).
                  summary: NVMe drive is overheating.
                expr: |
                  (
                    node_hwmon_temp_celsius{chip=~"nvme_.+",sensor="temp1"}
                    >= on (instance, chip, sensor)
                    node_hwmon_temp_max_celsius{chip=~"nvme_.+",sensor="temp1"}
                  )
                  * on (instance, chip) group_left (model, serial)
                    label_replace(node_nvme_info, "chip", "nvme_$1", "device", "(.+)")
                  * on (instance) group_left (nodename) node_uname_info
                for: 1m
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
