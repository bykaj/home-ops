---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app goldilocks-vpa
spec:
  interval: 1h
  path: ./kubernetes/apps/observability/goldilocks/vpa
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app goldilocks
spec:
  dependsOn:
    - name: goldilocks-vpa
  interval: 1h
  path: ./kubernetes/apps/observability/goldilocks/app
  postBuild:
    substitute:
      APP: *app
      APP_NAME: Goldilocks
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
