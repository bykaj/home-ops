---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app stash
spec:
  components:
    - ../../../../components/gpu
    - ../../../../components/zeroscaler/nfs
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: intel-gpu-resource-driver
      namespace: system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/media/stash/app
  postBuild:
    substitute:
      APP: *app
      APP_NAME: Stash
      KOPIUR_CAPACITY: 20Gi
      KOPIUR_MOVER_UID: "0"
      KOPIUR_MOVER_GID: "0"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
