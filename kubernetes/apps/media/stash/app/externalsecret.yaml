---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stash
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: stash-secret
    creationPolicy: Owner
    template:
      data:
        # Read by the stash-api-key HTTPRouteFilter, which expects the key "credential"
        credential: "{{ .ST_API_KEY }}"
  dataFrom:
    - extract:
        key: stash
      rewrite: [{ regexp: { source: (.*), target: ST_$1 } }]
