---
# yaml-language-server: $schema=https://schemas.bykaj.io/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plex-egress
spec:
  # Egress only: Plex is public and holds the Plex account token, and it talks
  # to many plex.tv hosts (sign-in, metadata, artwork, discovery) that change
  # without notice. So it may reach the internet (the `internet` group: public
  # space only) on any port and nothing in the cluster or on the LAN. The media
  # share is NFS, mounted by the kubelet, not the pod; clients and remote access
  # come in through envoy-external and the LoadBalancer, which this doesn't
  # touch. Casting or remote control towards LAN devices would need a rule
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toCIDRSet:
        - cidrGroupRef: internet
    # NAT-PMP port-mapping check (about hourly) to the pod's default gateway,
    # the node's cilium_host address. Nothing listens there, so Plex logs "Not
    # Supported by gateway" and moves on; dropped, it retries 12 times and sets
    # off CiliumEgressPolicyDenied. Remote access uses the manual port instead
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "5351"
              protocol: UDP
  # Local discovery: SSDP (239.255.255.250, about every 30 s), Plex's own GDM
  # (239.0.0.250 and 255.255.255.255) and the multicast group joins it sends
  # at startup. The pod can't reach the LAN, so none of it could work; the
  # `internet` group already leaves these ranges out. Denying them explicitly
  # drops them as POLICY_DENY instead of POLICY_DENIED, which
  # CiliumEgressPolicyDenied does not alert on (it fired on Plex's startup
  # burst after the NFS zeroscaler restarted it)
  egressDeny:
    - toCIDR:
        - 224.0.0.0/4
        - 255.255.255.255/32
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: plex
      app.kubernetes.io/instance: plex
