---
# yaml-language-server: $schema=https://schemas.bykaj.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-microservices
spec:
  chartRef:
    kind: OCIRepository
    name: immich-microservices
  interval: 1h
  dependsOn:
    - name: immich
  values:
    defaultPodOptions:
      enableServiceLinks: false
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: "${APP}-gpu"
      securityContext:
        fsGroup: 4000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 4000
        runAsNonRoot: true
        runAsUser: 4000
        supplementalGroups: [44]
    controllers:
      immich-microservices:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
            env:
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: "immich-postgres-app"
                    key: uri
              IMMICH_MEDIA_LOCATION: &mediaLocation /data
              IMMICH_TELEMETRY_INCLUDE: "all"
              IMMICH_WORKERS_EXCLUDE: "api"
              REDIS_HOSTNAME: "immich-dragonfly"
              TZ: "Europe/Amsterdam"
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      backups:
        type: nfs
        path: /mnt/vault/Backups
        server: "${NAS_HOST}"
        globalMounts:
          - path: /data/backups
            subPath: Apps/Immich
      library:
        type: nfs
        path: /mnt/vault/Photos/Library
        server: "${NAS_HOST}"
        globalMounts:
          - path: *mediaLocation
    service:
      immich-microservices:
        controller: immich-microservices
        ports:
          metrics-ms:
            port: 8082
    serviceMonitor:
      immich-microservices:
        enabled: true
        endpoints:
          - path: /metrics
            port: metrics-ms
            scheme: http
        serviceName: immich-microservices
