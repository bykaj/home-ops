---
# yaml-language-server: $schema=https://schemas.bykaj.io/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-egress
spec:
  # Egress only: the Immich API is public and reads every photo, so it may
  # reach its database, cache, machine learning, Pocket ID and the SMTP relay
  # and nothing else. The library, import and backup volumes are NFS, mounted
  # by the kubelet, not the pod. Map tiles load in the browser
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Every Postgres instance, since the primary moves on failover
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: immich-postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: immich-dragonfly
            app.kubernetes.io/name: dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # Smart search queries
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/controller: immich-machine-learning
            app.kubernetes.io/instance: immich-machine-learning
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
    # Pocket ID discovery and token calls: cyrannus.id resolves to the
    # envoy-external LoadBalancer IP, which Cilium translates to the envoy pods
    - toEndpoints:
        - matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
            k8s:io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # Email (test mails from the admin settings): smtp.bykaj.io resolves to the
    # relay's LoadBalancer IP, which Cilium translates to the relay pods
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: smtp-relay
            k8s:io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: immich
      app.kubernetes.io/instance: immich
