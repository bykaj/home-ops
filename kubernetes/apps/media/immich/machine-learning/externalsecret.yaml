---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-machine-learning
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich-machine-learning-secret
    creationPolicy: Owner
    template:
      data:
        # Fine-grained Hugging Face token without permissions: only lifts the
        # anonymous rate limit on model downloads, the models are public
        HF_TOKEN: "{{ .IMMICH_HF_TOKEN }}"
  dataFrom:
    - extract:
        key: immich
      rewrite: [{ regexp: { source: (.*), target: IMMICH_$1 } }]
