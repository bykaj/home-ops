---
# yaml-language-server: $schema=https://schemas.bykaj.io/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-machine-learning-egress
spec:
  # Egress only: machine learning gets every photo it is asked about and mounts
  # the library, so it may reach Hugging Face and nothing else: models are
  # downloaded on first use into the cache volume, and again only when they
  # change or the volume is lost. onnxruntime's telemetry (mobile.events.data.microsoft.com) is
  # switched off with ORT_DISABLE_TELEMETRY and stays blocked
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Model downloads: huggingface.co redirects the files to its CDNs, several
    # levels deep (us.aws.cdn.hf.co, cas-bridge.xethub.hf.co, cdn-lfs.hf.co);
    # "**." matches subdomains at any depth, "*." only one level
    - toFQDNs:
        - matchName: huggingface.co
        - matchPattern: "**.hf.co"
        - matchPattern: "**.huggingface.co"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: immich-machine-learning
      app.kubernetes.io/instance: immich-machine-learning
