---
# yaml-language-server: $schema=https://schemas.bykaj.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-machine-learning
spec:
  chartRef:
    kind: OCIRepository
    name: immich-machine-learning
  interval: 1h
  dependsOn:
    - name: immich
  values:
    defaultPodOptions:
      enableServiceLinks: false
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: "${APP}-gpu"
      securityContext:
        fsGroup: 4000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 4000
        runAsNonRoot: true
        runAsUser: 4000
        supplementalGroups: [44]
    controllers:
      immich-machine-learning:
        annotations:
          reloader.stakater.com/auto: "true"
        # The model cache is a ReadWriteOnce volume
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.4.0-openvino
            env:
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: "immich-postgres-app"
                    key: uri
              IMMICH_MEDIA_LOCATION: &mediaLocation /data
              MACHINE_LEARNING_MODEL_REVISION: "v2"
              MPLCONFIGDIR: "/cache/matplotlib"
              # onnxruntime sends usage telemetry to mobile.events.data.microsoft.com,
              # which the egress policy blocks
              ORT_DISABLE_TELEMETRY: "1"
              REDIS_HOSTNAME: "immich-dragonfly"
            envFrom:
              - secretRef:
                  name: immich-machine-learning-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /ping
                    port: &port 3003
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 60
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      backups:
        type: nfs
        path: /mnt/vault/Backups
        server: "nas.internal"
        globalMounts:
          - path: /data/backups
            subPath: Apps/Immich
      library:
        type: nfs
        path: /mnt/vault/Photos/Library
        server: "nas.internal"
        globalMounts:
          - path: *mediaLocation
      # Models downloaded from Hugging Face on first use, downloaded again if
      # lost; no backup
      cache:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: ceph-block
        # Otherwise named after the release
        suffix: cache
        advancedMounts:
          immich-machine-learning:
            app:
              - path: /cache
      tmpfs:
        type: emptyDir
        advancedMounts:
          immich-machine-learning:
            app:
              - path: /.cache
                subPath: dotCache
              - path: /tmp
                subPath: tmp
    service:
      app:
        ports:
          http:
            port: *port
