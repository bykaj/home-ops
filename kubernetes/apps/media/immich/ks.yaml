---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich
spec:
  components:
    - ../../../../components/dragonfly
    - ../../../../components/postgres
    - ../../../../components/zeroscaler/nfs
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'ready'
      current: status.phase == 'ready'
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/media/immich/app
  postBuild:
    substitute:
      APP: *app
      APP_NAME: Immich
      APP_DOMAIN: kaj.pics
      POSTGRES_BACKUP_SCHEDULE: "22 0 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich-machine-learning
spec:
  components:
    - ../../../../components/gpu
    - ../../../../components/zeroscaler/nfs
  dependsOn:
    - name: immich
    - name: intel-gpu-resource-driver
      namespace: system
  interval: 1h
  path: ./kubernetes/apps/media/immich/machine-learning
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich-microservices
spec:
  components:
    - ../../../../components/gpu
    - ../../../../components/zeroscaler/nfs
  dependsOn:
    - name: immich
    - name: intel-gpu-resource-driver
      namespace: system
  interval: 1h
  path: ./kubernetes/apps/media/immich/microservices
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
