---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app jellyfin
spec:
  components:
    - ../../../../components/gpu
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler/nfs
  dependsOn:
    - name: intel-gpu-resource-driver
      namespace: system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: tailscale-operator
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/media/jellyfin/app
  postBuild:
    substitute:
      APP: *app
      APP_NAME: Jellyfin
      KOPIUR_CAPACITY: 20Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
