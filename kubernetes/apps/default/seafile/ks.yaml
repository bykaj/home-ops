---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app seafile
  labels:
    # Brand-new database: remove once the first base backup has run
    components.database/mariadb: init
spec:
  components:
    - ../../../../components/database/mariadb
    - ../../../../components/database/dragonfly
    - ../../../../components/kopiur
  # LiteLLMVirtualKey CRD only; the key itself waits for the proxy
  dependsOn:
    - name: litellm-operator
      namespace: ai
    - name: mariadb-operator
      namespace: database
    - name: rook-ceph-cluster
      namespace: rook-ceph
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'ready'
      current: status.phase == 'ready'
    - apiVersion: k8s.mariadb.com/v1alpha1
      kind: MariaDB
      current: has(status.conditions) && status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/default/seafile/app
  postBuild:
    substitute:
      APP: *app
      APP_NAME: Seafile
      # File blocks live in Garage; the PVC holds the generated config, avatars,
      # thumbnails and logs
      KOPIUR_CAPACITY: 5Gi
      # NON_ROOT runs the Seafile processes as uid 8000
      KOPIUR_MOVER_UID: "8000"
      KOPIUR_MOVER_GID: "8000"
      MARIADB_BACKUP_SCHEDULE: "57 0 * * *"
      MARIADB_DATABASE: seafile_db
      MARIADB_USERNAME: seafile
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
