---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seafile
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: seafile-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Only read on the first start, to create the local admin account
        INIT_SEAFILE_ADMIN_EMAIL: "{{ .SF_ADMIN_EMAIL }}"
        INIT_SEAFILE_ADMIN_PASSWORD: "{{ .SF_ADMIN_PASSWORD }}"
        JWT_PRIVATE_KEY: "{{ .SF_JWT_PRIVATE_KEY }}"
        OAUTH_CLIENT_ID: "{{ .SF_OIDC_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .SF_OIDC_CLIENT_SECRET }}"
        S3_KEY_ID: "{{ .SF_S3_ACCESS_KEY_ID }}"
        S3_SECRET_KEY: "{{ .SF_S3_SECRET_ACCESS_KEY }}"
        # Seahub signs its requests to Seafile AI with the shared JWT key
        SEAFILE_AI_SECRET_KEY: "{{ .SF_JWT_PRIVATE_KEY }}"
        # SeaSearch's admin, created on its first start; Seafile and Seafile AI
        # authenticate with base64(user:password)
        SEASEARCH_PASSWORD: "{{ .SF_SEASEARCH_PASSWORD }}"
        SEASEARCH_TOKEN: '{{ printf "seafile:%s" .SF_SEASEARCH_PASSWORD | b64enc }}'
        SMTP_FROM: "Seafile <{{ .EM_SMTP_MAIL_FROM }}>"
  dataFrom:
    - extract:
        key: seafile
      rewrite: [{ regexp: { source: (.*), target: SF_$1 } }]
    - extract:
        key: smtp
      rewrite: [{ regexp: { source: (.*), target: EM_$1 } }]
