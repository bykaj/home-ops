---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app windshift
spec:
  components:
    - ../../../../components/postgres
  # LiteLLMVirtualKey CRD only; the key itself waits for the proxy
  dependsOn:
    - name: litellm-operator
      namespace: ai
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/default/windshift/app
  postBuild:
    substitute:
      APP: *app
      APP_NAME: Windshift
      APP_SUBDOMAIN: projects
      POSTGRES_BACKUP_SCHEDULE: "54 0 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
