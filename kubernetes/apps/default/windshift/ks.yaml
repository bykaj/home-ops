---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app windshift
spec:
  components:
    - ../../../../components/database/postgres
  # LiteLLMVirtualKey CRD only; the key itself waits for the proxy
  dependsOn:
    - name: litellm-operator
      namespace: ai
  # Only evaluated for the resources listed in healthChecks; current-only, so
  # a database that is still starting counts as in progress, not failed
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: has(status.conditions) && status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: windshift-postgres
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/windshift/app
  postBuild:
    substitute:
      APP: *app
      APP_NAME: Windshift
      APP_SUBDOMAIN: projects
      POSTGRES_BACKUP_SCHEDULE: "54 0 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
