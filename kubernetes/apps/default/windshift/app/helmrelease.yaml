---
# yaml-language-server: $schema=https://schemas.bykaj.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app windshift
spec:
  chartRef:
    kind: OCIRepository
    name: windshift
  dependsOn: []
  interval: 1h
  values:
    controllers:
      windshift:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/windshiftapp/windshift
              tag: 0.9.2
            env:
              ALLOW_LOCAL_CONNECTIONS: "true"
              ALLOWED_HOSTS: "${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.bykaj.app}"
              # Attachments live in Garage. Older rows store absolute paths
              # under ATTACHMENT_PATH, which Windshift strips to get the object
              # key, so it has to stay; it's also the CSV import scratch dir
              ATTACHMENT_PATH: "/data/attachments"
              BASE_URL: "https://${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.bykaj.app}"
              LOG_LEVEL: "info"
              PORT: &port 8080
              POSTGRES_CONNECTION_STRING:
                valueFrom:
                  secretKeyRef:
                    name: windshift-postgres-app
                    key: uri
              S3_BUCKET: "${APP}"
              S3_ENDPOINT: "https://s3.bykaj.io"
              S3_FORCE_PATH_STYLE: "true"
              S3_REGION: "eu-west"
              STORAGE_BACKEND: "s3"
              TZ: "Europe/Amsterdam"
              USE_PROXY: "true"
              WEBAUTHN_RP_ID: "${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.bykaj.app}"
              WEBAUTHN_RP_NAME: "${APP_NAME}"
              WINDSHIFT_CONTAINER_MEMORY_LIMIT: "2G"
              WINDSHIFT_MEMORY_LIMIT_MB: "2048"
            envFrom:
              - secretRef:
                  name: windshift-secret
            probes:
              # /readyz also fails while Garage is down; liveness uses /healthz
              # so a NAS outage doesn't restart the pod
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
                  successThreshold: 1
                  timeoutSeconds: 1
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 2Gi
        serviceAccount:
          identifier: *app
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 4000
        runAsGroup: 4000
        fsGroup: 4000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /data/attachments
            subPath: attachments
          - path: /tmp
            subPath: tmp
    route:
      app:
        hostnames:
          - "${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.bykaj.app}"
        parentRefs:
          - name: envoy-external
            namespace: network
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
