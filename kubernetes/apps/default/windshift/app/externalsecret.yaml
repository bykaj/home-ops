---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windshift
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: windshift-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Database Init
        INIT_POSTGRES_HOST: "${DB_HOST}"
        INIT_POSTGRES_DBNAME: "{{ .WS_POSTGRES_DB }}"
        INIT_POSTGRES_USER: "{{ .WS_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .WS_POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_USER: "{{ .PG_POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .PG_POSTGRES_SUPER_PASS }}"
        # Application Configuration
        POSTGRES_CONNECTION_STRING: "postgres://{{ .WS_POSTGRES_USER }}:{{ .WS_POSTGRES_PASSWORD }}@${DB_HOST}:5432/{{ .WS_POSTGRES_DB }}?sslmode=disable"
        SSO_SECRET: "{{ .WS_SSO_SECRET }}"
  dataFrom:
    - extract:
        key: windshift
      rewrite: [{regexp: {source: (.*), target: WS_$1}}]
    - extract:
        key: cloudnative-pg
      rewrite: [{regexp: {source: (.*), target: PG_$1}}]
