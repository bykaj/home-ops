---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app wallos
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/default/wallos/app
  postBuild:
    substitute:
      APP: *app
      APP_NAME: Wallos
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_MOVER_UID: "82"
      KOPIUR_MOVER_GID: "82"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
