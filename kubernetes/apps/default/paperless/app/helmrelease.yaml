---
# yaml-language-server: $schema=https://schemas.bykaj.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless
spec:
  chartRef:
    kind: OCIRepository
    name: paperless
  dependsOn: []
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.4.2@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84
            env:
              # OIDC integration
              PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
              PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
              PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"
              # Configure application
              PAPERLESS_FILENAME_FORMAT: "{ created }-{ correspondent }-{ title }"
              PAPERLESS_PORT: &port 8000
              PAPERLESS_REDIS: "redis://${APP}-dragonfly:6379"
              PAPERLESS_TASK_WORKERS: "2"
              PAPERLESS_TIME_ZONE: "Europe/Amsterdam"
              PAPERLESS_URL: "https://${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.bykaj.app}"
              PAPERLESS_WEBSERVER_WORKERS: "2"
              # Database configuration
              PAPERLESS_DBENGINE: "postgresql"
              PAPERLESS_DBHOST: "${APP}-postgres-rw.default"
              PAPERLESS_DBNAME:
                valueFrom:
                  secretKeyRef:
                    name: "${APP}-postgres-app"
                    key: dbname
              PAPERLESS_DBPASS:
                valueFrom:
                  secretKeyRef:
                    name: "${APP}-postgres-app"
                    key: password
              PAPERLESS_DBUSER:
                valueFrom:
                  secretKeyRef:
                    name: "${APP}-postgres-app"
                    key: username
              # Configure email sending; set explicitly in case the defaults change
              PAPERLESS_EMAIL_HOST: "smtp.bykaj.io"
              PAPERLESS_EMAIL_PORT: "25"
              PAPERLESS_EMAIL_USE_SSL: "false"
              PAPERLESS_EMAIL_USE_TLS: "false"
              # AI suggestions and document chat, through the LiteLLM proxy;
              # embeddings use the same endpoint and key
              PAPERLESS_AI_ENABLED: "true"
              PAPERLESS_AI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: "${APP}-litellm"
                    key: api-key
              PAPERLESS_AI_LLM_BACKEND: "openai-like"
              PAPERLESS_AI_LLM_EMBEDDING_BACKEND: "openai-like"
              PAPERLESS_AI_LLM_EMBEDDING_MODEL: "openai/text-embedding-3-small"
              PAPERLESS_AI_LLM_ENDPOINT: "http://litellm.ai.svc.cluster.local:4000/v1"
              PAPERLESS_AI_LLM_MODEL: "chatgpt/gpt-6-luna"
              # Suggested titles and tags, and chat answers, in Dutch
              PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: "nl-nl"
              # Configure folders
              PAPERLESS_CONSUMPTION_DIR: /mnt/archive/consume
              PAPERLESS_DATA_DIR: &dataPath /usr/src/paperless/data
              PAPERLESS_EXPORT_DIR: /mnt/archive/export
              PAPERLESS_MEDIA_ROOT: /mnt/archive/media
              # Configure folder importer
              PAPERLESS_CONSUMER_POLLING: "15"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              # Configure OCR. The models (nld, eng, deu, fra, spa, ita) come
              # from the tessdata image volume below, so PAPERLESS_OCR_LANGUAGES
              # (an apt install at every start) stays unset
              PAPERLESS_OCR_LANGUAGE: nld+eng
              # Configure user permissions
              USERMAP_UID: "${APP_UID}"
              USERMAP_GID: "${APP_GID}"
            envFrom:
              - secretRef:
                  name: paperless-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 25m
                memory: 2Gi
              limits:
                memory: 4Gi
    persistence:
      archive:
        type: nfs
        path: /mnt/vault/Archive
        server: nas.internal
        globalMounts:
          - path: /mnt/archive
      backups:
        type: nfs
        path: /mnt/vault/Backups
        server: nas.internal
        globalMounts:
          - path: /mnt/backups
            subPath: Apps/Paperless
      config:
        existingClaim: "${KOPIUR_CLAIM:=${APP}}"
        globalMounts:
          - path: *dataPath
      # Tesseract's complete tessdata folder with the most accurate ("best")
      # models from a data-only image (bykaj/containers), mounted over the
      # image's own folder. The `5` is Tesseract's major version: move the
      # path along when a Paperless image ships Tesseract 6
      tessdata:
        type: image
        image:
          repository: ghcr.io/bykaj/paperless-tessdata
          tag: 4.1.0@sha256:815bf342bdaaf08b5770f9d3c840ab94b282d0ae9153e303165937f0e36b0bef
        globalMounts:
          - path: /usr/share/tesseract-ocr/5/tessdata
            readOnly: true
            subPath: tessdata
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /usr/src/paperless/data/log
            subPath: log
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Tools"
          gethomepage.dev/name: "${APP_NAME}"
          gethomepage.dev/icon: "paperless-ngx.png"
          gethomepage.dev/widget.type: "paperlessngx"
          gethomepage.dev/widget.url: "https://${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.bykaj.app}"
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_PAPERLESS_API_KEY}}` }}"
          gethomepage.dev/widget.fields: '["total", "inbox"]'
        hostnames:
          - "${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.bykaj.app}"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: *app
                port: *port
    service:
      *app :
        primary: true
        controller: *app
        ports:
          http:
            port: *port
