---
# yaml-language-server: $schema=https://schemas.bykaj.io/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperless-egress
spec:
  # Egress only: Paperless is public, holds every document plus the database,
  # OIDC and LiteLLM credentials, so it may reach its database, cache, LiteLLM,
  # Pocket ID, the SMTP relay, Fastmail IMAP and the Debian mirror and nothing
  # else. The
  # archive is an NFS volume, mounted by the kubelet, not the pod. The update
  # check (api.github.com) is off for every user and stays blocked; switching
  # it on in the UI settings sets off CiliumEgressPolicyDenied
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Every Postgres instance, since the primary moves on failover
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: paperless-postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: paperless-dragonfly
            app.kubernetes.io/name: dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # AI suggestions, chat and embeddings (PAPERLESS_AI_LLM_*)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: litellm
            app.kubernetes.io/name: litellm
            k8s:io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    # Pocket ID discovery and token calls: cyrannus.id resolves to the
    # envoy-external LoadBalancer IP, which Cilium translates to the envoy pods
    - toEndpoints:
        - matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
            k8s:io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # Email: smtp.bykaj.io resolves to the relay's LoadBalancer IP, which Cilium
    # translates to the relay pods
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: smtp-relay
            k8s:io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
    # Mail rules: consume attachments from the Fastmail mailbox over IMAPS
    - toFQDNs:
        - matchName: imap.fastmail.com
      toPorts:
        - ports:
            - port: "993"
              protocol: TCP
    # The image has no Dutch OCR data; init-tesseract-langs apt-installs
    # tesseract-ocr-nld (PAPERLESS_OCR_LANGUAGES) on every start, over plain
    # HTTP from the image's Debian sources. By IP, not toFQDNs: a fresh pod's
    # first apt connections went out before Cilium had loaded the IPs from the
    # DNS answer and were dropped, so the install failed and the pod restarted.
    # These are the Fastly anycast addresses deb.debian.org (a CNAME to
    # debian.map.fastlydns.net) resolves to; if they change, the install fails
    # and CiliumEgressPolicyDenied names the new IP
    - toCIDR:
        - 151.101.2.132/32
        - 151.101.66.132/32
        - 151.101.130.132/32
        - 151.101.194.132/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: paperless
      app.kubernetes.io/instance: paperless
