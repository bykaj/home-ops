---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperless-secret
    creationPolicy: Owner
    template:
      data:
        PAPERLESS_ADMIN_USER: "{{ .PL_PAPERLESS_ADMIN_USER }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .PL_PAPERLESS_ADMIN_PASSWORD }}"
        PAPERLESS_API_KEY: "{{ .PL_PAPERLESS_API_KEY }}"
        PAPERLESS_EMAIL_FROM: "Paperless <{{ .EM_SMTP_MAIL_FROM }}>"
        PAPERLESS_LOGOUT_REDIRECT_URL: "{{ .PL_PAPERLESS_LOGOUT_URL }}"
        PAPERLESS_SECRET_KEY: "{{ .PL_PAPERLESS_SECRET_KEY }}"
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |
          {
            "openid_connect": {
                "APPS": [
                  {
                      "client_id": "{{ .PL_OIDC_CLIENT_ID }}",
                      "name": "{{ .PL_OIDC_PROVIDER_NAME }}",
                      "provider_id": "{{ .PL_OIDC_PROVIDER_SLUG }}",
                      "secret": "{{ .PL_OIDC_CLIENT_SECRET }}",
                      "settings": {
                        "server_url": "{{ .PL_OIDC_SERVER_URL }}"
                      }
                  }
                ],
                "OAUTH_PKCE_ENABLED": true
            }
          }
        PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "{{ .PL_PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS }}"
  dataFrom:
    - extract:
        key: paperless
      rewrite: [{ regexp: { source: (.*), target: PL_$1 } }]
    - extract:
        key: smtp
      rewrite: [{ regexp: { source: (.*), target: EM_$1 } }]
