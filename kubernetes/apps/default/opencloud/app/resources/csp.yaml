---
# OpenCloud's default CSP plus Pocket ID, which the web client calls for
# tokens and loads in a hidden iframe for silent renewal
directives:
  child-src:
    - "'self'"
  connect-src:
    - "'self'"
    - "blob:"
    - "https://cyrannus.id/"
    - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
    - "https://update.opencloud.eu/"
  default-src:
    - "'none'"
  font-src:
    - "'self'"
  frame-ancestors:
    - "'self'"
  frame-src:
    - "'self'"
    - "blob:"
    - "https://cyrannus.id/"
    - "https://embed.diagrams.net/"
  img-src:
    - "'self'"
    - "blob:"
    - "data:"
    - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
  manifest-src:
    - "'self'"
  media-src:
    - "'self'"
  object-src:
    - "'self'"
    - "blob:"
  script-src:
    - "'self'"
    - "'unsafe-inline'"
    - "https://cyrannus.id/"
  style-src:
    - "'self'"
    - "'unsafe-inline'"
    - "blob:"
  worker-src:
    - "'self'"
    - "blob:"
