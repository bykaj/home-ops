---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencloud
spec:
  chartRef:
    kind: OCIRepository
    name: opencloud
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 4000
            runAsGroup: 4000
            runAsNonRoot: true
            fsGroup: 4000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: docker.io/opencloudeu/opencloud-rolling
              tag: 9.0.0@sha256:bd57f039d0dd3df510fb25f178beefdf0b1f049097285feead607824460e6506
            command:
              - "/bin/sh"
              - "-c"
              - "opencloud init || true; opencloud server"
            env:
              # Users are created on first login and get no role from OpenCloud
              # itself: proxy.yaml maps their Pocket ID groups to roles
              GRAPH_ASSIGN_DEFAULT_USER_ROLE: false
              GRAPH_USERNAME_MATCH: "none"
              IDM_CREATE_DEMO_USERS: false
              OC_ADMIN_USER_ID: ""
              OC_ENABLE_OCM: false
              # Pocket ID replaces the built-in IdP; the built-in IDM keeps the
              # provisioned accounts
              OC_EXCLUDE_RUN_SERVICES: "idp"
              OC_INSECURE: false
              OC_LOG_LEVEL: "info"
              OC_OIDC_ISSUER: "https://cyrannus.id"
              OC_URL: "https://${APP_DOMAIN:-${APP_SUBDOMAIN:-${APP}}.bykaj.app}"
              PROXY_AUTOPROVISION_ACCOUNTS: true
              # Pocket ID's sub is stable across username changes
              PROXY_AUTOPROVISION_CLAIM_USERNAME: "sub"
              PROXY_CSP_CONFIG_FILE_LOCATION: "/etc/opencloud/csp.yaml"
              # Clients ask OpenCloud for the IdP; point them at Pocket ID
              PROXY_OIDC_REWRITE_WELLKNOWN: true
              PROXY_TLS: false
              PROXY_USER_CS3_CLAIM: "username"
              PROXY_USER_OIDC_CLAIM: "sub"
              SETTINGS_SETUP_DEFAULT_ASSIGNMENTS: false
              STORAGE_USERS_DECOMPOSEDS3_BUCKET: "${APP}"
              STORAGE_USERS_DECOMPOSEDS3_ENDPOINT: "https://s3.bykaj.io"
              STORAGE_USERS_DECOMPOSEDS3_REGION: "eu-west"
              STORAGE_USERS_DRIVER: "decomposeds3"
              WEB_OIDC_CLIENT_ID: "opencloud-web"
              # Pocket ID only sends the groups claim for the groups scope
              WEB_OIDC_SCOPE: "openid profile email groups"
              WEB_OPTION_ACCOUNT_EDIT_LINK_HREF: "https://cyrannus.id/settings/account"
              # The desktop and iOS apps use these fixed client IDs
              WEBFINGER_DESKTOP_OIDC_CLIENT_SCOPES: "openid profile email groups offline_access"
              WEBFINGER_IOS_OIDC_CLIENT_SCOPES: "openid profile email groups offline_access"
            envFrom:
              - secretRef:
                  name: opencloud-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1024Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      config:
        type: configMap
        name: opencloud-config
        globalMounts:
          - path: /etc/opencloud/csp.yaml
            subPath: csp.yaml
            readOnly: true
          - path: /etc/opencloud/proxy.yaml
            subPath: proxy.yaml
            readOnly: true
      data:
        existingClaim: "${KOPIUR_CLAIM:=${APP}}"
        globalMounts:
          - path: /var/lib/opencloud
            subPath: data
          - path: /etc/opencloud
            subPath: config
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
    route:
      app:
        hostnames:
          - "${APP_DOMAIN:-${APP_SUBDOMAIN:-${APP}}.bykaj.app}"
        parentRefs:
          - name: envoy-external
            namespace: network
    service:
      app:
        ports:
          http:
            port: 9200
