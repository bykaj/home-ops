---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mail-archiver
  labels:
    components.postgres/cnpg: init
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/postgres
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/default/mail-archiver/app
  postBuild:
    substitute:
      APP: *app
      APP_NAME: "Mail Archiver"
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_MOVER_UID: "0"
      KOPIUR_MOVER_GID: "0"
      POSTGRES_BACKUP_SCHEDULE: "18 0 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
