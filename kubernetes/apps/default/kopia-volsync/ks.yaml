---
# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kopia-volsync
spec:
  components:
    - ../../../../components/zeroscaler/nfs
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/kopia-volsync/app
  postBuild:
    substitute:
      APP: *app
      APP_NAME: "Kopia Volsync"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
