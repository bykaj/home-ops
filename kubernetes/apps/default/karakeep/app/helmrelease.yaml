---
# yaml-language-server: $schema=https://schemas.bykaj.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app karakeep
spec:
  chartRef:
    kind: OCIRepository
    name: karakeep
  interval: 1h
  values:
    controllers:
      karakeep:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            app.kubernetes.io/component: application
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
            env:
              # Application config
              DATA_DIR: &dataDir "/data"
              DISABLE_NEW_RELEASE_CHECK: "true"
              MEILI_ADDR: "http://meilisearch.database:7700"
              NEXTAUTH_URL: "https://${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.${DOMAIN_APP}}"
              RATE_LIMITING_ENABLED: "true"
              TZ: "${TIMEZONE}"
              # Asset storage config
              ASSET_STORE_S3_FORCE_PATH_STYLE: "true"
              # Authentication config
              DISABLE_PASSWORD_AUTH: "true"
              DISABLE_SIGNUPS: "false"
              OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
              OAUTH_PROVIDER_NAME: "Cetana ID"
              OAUTH_SCOPE: "openid profile email"
              # Inference config
              EMBEDDING_DIMENSIONS: "1536"
              EMBEDDING_ENABLE_AUTO_INDEXING: "true"
              EMBEDDING_TEXT_MODEL: "text-embedding-3-small"
              INFERENCE_CONTEXT_LENGTH: "8192"
              INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"
              INFERENCE_ENABLE_AUTO_TAGGING: "true"
              INFERENCE_IMAGE_MODEL: "gpt-4o-mini"
              INFERENCE_LANG: "english"
              INFERENCE_TEXT_MODEL: "gpt-5.6-luna"
              INFERENCE_USE_MAX_COMPLETION_TOKENS: "true"
              # Crawler config
              BROWSER_CONNECT_ONDEMAND: "true"
              BROWSER_WEB_URL: http://karakeep-chrome.default.svc.cluster.local:9222
              CRAWLER_NUM_WORKERS: 2
              CRAWLER_DOMAIN_RATE_LIMIT_WINDOW_MS: 15000
              CRAWLER_DOMAIN_RATE_LIMIT_REQUESTS: 2
              CRAWLER_JOB_TIMEOUT_SEC: 120
              CRAWLER_ENABLE_ADBLOCKER: "true"
              CRAWLER_DOWNLOAD_BANNER_IMAGE: "true"
              CRAWLER_STORE_SCREENSHOT: "true"
              CRAWLER_FULL_PAGE_SCREENSHOT: "true"
              CRAWLER_SCREENSHOT_TIMEOUT_SEC: 120
              CRAWLER_ALLOWED_INTERNAL_HOSTNAMES: ".local,.${DOMAIN_APP}"
              # OCR config
              OCR_LANGS: "eng,nld"
              OCR_USE_LLM: "true"
            envFrom:
              - secretRef:
                  name: karakeep-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 3000
                    path: /api/health
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
      chrome:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            app.kubernetes.io/component: chrome
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep-chrome
              tag: 151.0.7922.47-r1@sha256:5b19bbb160e9ff60681a3abd97e1c4ec9f64212301410de658c3900ab7ef31e7
            args:
              - --headless
              - --disable-gpu
              - --disable-dev-shm-usage
              - --hide-scrollbars
              - --disable-blink-features=AutomationControlled
              - --window-size=1440,900
            securityContext:
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    persistence:
      config:
        existingClaim: "${VOLSYNC_CLAIM:=${APP}}"
        advancedMounts:
          karakeep:
            app:
              - path: *dataDir
      tmpfs:
        type: emptyDir
        advancedMounts:
          karakeep:
            app:
              - path: /app/apps/web/.next/cache
                subPath: cache
        globalMounts:
          - path: /tmp
            subPath: tmp
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Tools"
          gethomepage.dev/name: "${APP_NAME}"
          gethomepage.dev/icon: "sh-karakeep.svg"
          gethomepage.dev/widget.type: "karakeep"
          gethomepage.dev/widget.url: "https://${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.${DOMAIN_APP}}"
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_KARAKEEP_API_KEY}}` }}"
          gethomepage.dev/widget.fields: '["bookmarks", "favorites", "lists", "highlights"]'
        hostnames:
          - "${APP_DOMAIN:=${APP_SUBDOMAIN:=${APP}}.${DOMAIN_APP}}"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: *app
                port: *port
    service:
      karakeep:
        primary: true
        controller: *app
        ports:
          http:
            port: *port
      chrome:
        controller: chrome
        ports:
          http:
            port: 9222
