---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smtp-relay
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: smtp-relay-secret
    creationPolicy: Owner
    template:
      data:
        SMTP_RELAY_PASSWORD: "{{ .EM_SMTP_PASSWORD }}"
        SMTP_RELAY_SERVER: "{{ .EM_SMTP_SERVER }}"
        SMTP_RELAY_USERNAME: "{{ .EM_SMTP_USERNAME }}"
  dataFrom:
    - extract:
        key: smtp
      rewrite: [{ regexp: { source: (.*), target: EM_$1 } }]
