---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smtp-relay
spec:
  chartRef:
    kind: OCIRepository
    name: smtp-relay
  interval: 1h
  values:
    controllers:
      smtp-relay:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsGroup: 4000
            runAsNonRoot: true
            runAsUser: 4000
        replicas: 2
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/foxcpp/maddy
              tag: 0.9.6
            env:
              SMTP_RELAY_HOSTNAME: smtp-relay.bykaj.app
              SMTP_RELAY_METRICS_PORT: &metricsPort 8080
              SMTP_RELAY_SMTP_PORT: &smtpPort 25
            envFrom:
              - secretRef:
                  name: smtp-relay-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      cache:
        type: emptyDir
        globalMounts:
          - path: /cache
      config:
        type: configMap
        name: smtp-relay-configmap
        globalMounts:
          - path: /data/maddy.conf
            subPath: maddy.conf
            readOnly: true
    service:
      app:
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: smtp-relay.bykaj.app
          gatus.home-operations.com/endpoint: |-
            group: infrastructure
            url: tcp://smtp-relay.network.svc.cluster.local:25
            interval: 1m
            ui:
              hide-url: true
          lbipam.cilium.io/ips: 10.73.20.203
        # Keeps the client IP so the network policy can match the NAS
        externalTrafficPolicy: Local
        ports:
          metrics:
            port: *metricsPort
          smtp:
            primary: true
            port: *smtpPort
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
