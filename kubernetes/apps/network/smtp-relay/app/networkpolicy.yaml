---
# yaml-language-server: $schema=https://schemas.bykaj.io/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: smtp-relay
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: smtp-relay
  ingress:
    # Pods, nodes and probes
    - fromEntities:
        - cluster
    # The relay accepts mail without authentication, so LAN access is allowlisted
    - fromCIDRSet:
        - cidrGroupRef: nas
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
