# yaml-language-server: $schema=https://schemas.bykaj.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kvm-icarus
spec:
  interval: 1h
  path: ./kubernetes/apps/network/external-services/kvm-icarus
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
