---
# yaml-language-server: $schema=https://schemas.bykaj.io/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: doco-cd-webhook
  annotations:
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == 405"]
      group: infrastructure
      url: https://doco-cd-webhook.bykaj.io/v1/webhook
spec:
  hostnames: ["doco-cd-webhook.bykaj.io"]
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: doco-cd-webhook
      matches:
        - path:
            type: Exact
            value: /v1/webhook
