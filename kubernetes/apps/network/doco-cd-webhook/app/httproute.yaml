---
# yaml-language-server: $schema=https://schemas.bykaj.io/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: doco-cd-webhook
  annotations:
    # Every request to /v1/webhook creates a doco-cd job, so probe /v1/health through the route instead.
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == 200"]
      group: infrastructure
      url: https://doco-cd-webhook.bykaj.io/v1/health
spec:
  hostnames: ["doco-cd-webhook.bykaj.io"]
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: doco-cd-webhook
      filters:
        # Traefik on the NAS routes on the Host header
        - type: URLRewrite
          urlRewrite:
            hostname: doco-cd.bykaj.app
      matches:
        - path:
            type: Exact
            value: /v1/health
        - path:
            type: Exact
            value: /v1/webhook
