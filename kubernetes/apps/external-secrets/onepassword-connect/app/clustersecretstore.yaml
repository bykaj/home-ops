---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.external-secrets.svc.cluster.local:8080
      # Searched in this order: an item in Homelab wins, Automation (shared
      # with GitHub Actions) only supplies items Homelab doesn't have, such as
      # the github-bot App credentials that the runners and konflate need.
      # Connect's token must be able to read every vault listed here
      vaults:
        Homelab: 1
        Automation: 2
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-secret
            key: token
            namespace: external-secrets
