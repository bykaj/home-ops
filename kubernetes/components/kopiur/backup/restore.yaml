---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: "${KOPIUR_CLAIM:-${APP}}"
spec:
  credentialProjection:
    enabled: true
  mover:
    inheritSecurityContextFrom:
      workloadSelector:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: "${KOPIUR_CLAIM:-${APP}}"
        container: app
    # securityContext:
    #   runAsUser: ${KOPIUR_MOVER_UID:=4000}
    #   runAsGroup: ${KOPIUR_MOVER_GID:=4000}
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: "${KOPIUR_CLAIM:-${APP}}"
      offset: 0 # 0 = latest snapshot
  target:
    populator: {}
