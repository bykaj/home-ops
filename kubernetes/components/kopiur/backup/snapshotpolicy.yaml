---
# yaml-language-server: $schema=https://schemas.bykaj.io/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: "${KOPIUR_CLAIM:-${APP}}"
  annotations:
    kopiur.home-operations.com/allow-identity-change: "true"
spec:
  compression:
    compressor: zstd
  copyMethod: Snapshot
  credentialProjection:
    enabled: true
  mover:
    cache:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      mode: Persistent
      storageClassName: ${KOPIUR_CACHE_STORAGECLASS:=openebs-hostpath}
    securityContext:
      runAsUser: ${KOPIUR_MOVER_UID:=4000}
      runAsGroup: ${KOPIUR_MOVER_GID:=4000}
    # inheritSecurityContextFrom:
    #   pvcConsumer: {}
    # securityContext:
    #   runAsUser: ${KOPIUR_MOVER_UID:=4000}
    #   runAsGroup: ${KOPIUR_MOVER_GID:=4000}
    #   runAsNonRoot: ${KOPIUR_NON_ROOT:=true} # keep the unprivileged guarantee
    #   allowPrivilegeEscalation: false
    #   capabilities:
    #       drop: ["ALL"]
    #   seccompProfile:
    #       type: RuntimeDefault
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: "${KOPIUR_CLAIM:-${APP}}"
  upload:
    maxParallelFileReads: 2
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}
