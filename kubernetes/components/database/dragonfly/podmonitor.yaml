---
# yaml-language-server: $schema=https://schemas.bykaj.io/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ${APP}-dragonfly
spec:
  selector:
    matchLabels:
      app: ${APP}-dragonfly
  podTargetLabels: ["app"]
  podMetricsEndpoints:
    - port: admin
  fallbackScrapeProtocol: PrometheusText1.0.0
