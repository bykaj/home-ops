---
# yaml-language-server: $schema=https://schemas.bykaj.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ${APP}-mariadb
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # A restore needs the root password of the backup, so it can't be generated
        ROOT_PASSWORD: "{{ .MARIADB_ROOT_PASSWORD }}"
        S3_ACCESS_KEY_ID: "{{ .MARIADB_S3_ACCESS_KEY_ID }}"
        S3_SECRET_ACCESS_KEY: "{{ .MARIADB_S3_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: mariadb
