---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./backup.yaml
  - ./externalsecret.yaml
  - ./mariadb.yaml
  - ./physicalbackup.yaml
  - ./pointintimerecovery.yaml
  - ./user.yaml
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: mariadb-operator
          namespace: database
