---
# yaml-language-server: $schema=https://schemas.bykaj.io/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ${APP}-daily
spec:
  backupOwnerReference: self
  cluster:
    name: ${APP}-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  # Six fields, seconds first, in the operator's time zone: Europe/Amsterdam,
  # which k8tz injects (not UTC, though the chart sets no TZ). Set per app:
  # base backups that start together abort with HTTP 499 on Garage's UploadPart
  schedule: "${POSTGRES_BASE_BACKUP_SCHEDULE:=0 40 4 * * *}"
