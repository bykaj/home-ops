---
# yaml-language-server: $schema=https://schemas.bykaj.io/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ${APP}-daily
spec:
  backupOwnerReference: self
  cluster:
    name: ${APP}-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: "0 40 4 * * *"
