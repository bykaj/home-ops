---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ${APP}-postgres
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        S3_ACCESS_KEY_ID: "{{ .POSTGRES_S3_ACCESS_KEY_ID }}"
        S3_SECRET_ACCESS_KEY: "{{ .POSTGRES_S3_SECRET_ACCESS_KEY }}"
        S3_REGION: "{{ .POSTGRES_S3_REGION }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
